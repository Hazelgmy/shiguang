<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拾光 · 日记</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f7f4ee;
      --paper: #fbf9f4;
      --line: #ded8cd;
      --text: #403b35;
      --muted: #9b9387;
      --soft: #c8c0b4;
      --accent: #4d4943;
    }

    /* ===== 滚动条 ===== */

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--soft);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    ::-webkit-scrollbar-corner {
      background: transparent;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: var(--soft) transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", "Noto Serif SC", serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ===== 配置栏 ===== */
    .config-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .config-toggle {
      display: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      padding: 4px 10px;
    }

    .config-inputs {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .config-field {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .config-field span {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .config-field input {
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      outline: none;
      color: var(--text);
      padding: 6px 2px;
      font-size: 13px;
      width: 150px;
    }

    .config-status {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .config-status.ok {
      color: #7a8f6b;
    }

    .config-status.err {
      color: #b85c5c;
    }

    .config-test {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      padding: 6px 16px;
      font-size: 12px;
      transition: 0.18s ease;
    }

    .config-test:hover {
      background: #eee9e0;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 330px 1fr;
    }

    /* Sidebar */

    .sidebar {
      min-height: 100vh;
      padding: 34px 30px;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.18);
    }

    .search {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      outline: none;
      padding: 10px 2px 12px;
      color: var(--text);
      margin-bottom: 34px;
    }

    .search::placeholder {
      color: #b8b1a7;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 23px;
    }

    .calendar-title {
      letter-spacing: 4px;
      font-size: 16px;
    }

    .calendar-nav {
      display: flex;
      gap: 13px;
    }

    .calendar-nav button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 3px;
      font-size: 18px;
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }

    .weekdays {
      margin-bottom: 10px;
      font-size: 12px;
      color: #aaa297;
    }

    .days {
      row-gap: 10px;
    }

    .day {
      position: relative;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .day:hover {
      background: rgba(76, 72, 65, 0.07);
    }

    .day.other {
      color: #d1cbc1;
    }

    .day.selected {
      background: var(--accent);
      color: white;
    }

    .day.has-entry::after {
      content: "";
      position: absolute;
      bottom: 4px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #9b8063;
    }

    .day.selected::after {
      background: white;
    }

    .month-entries {
      margin-top: 28px;
      border-top: 1px solid var(--line);
      padding-top: 24px;
    }

    .entries-title {
      margin-bottom: 18px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .entry-item {
      position: relative;
      padding: 10px 10px 13px;
      cursor: pointer;
      border-bottom: 1px solid rgba(222, 216, 205, 0.55);
    }

    .entry-item:hover .entry-name {
      color: #8d6e52;
    }

    .entry-item.active {
      background: rgba(76, 72, 65, 0.06);
      border-radius: 8px;
    }

    .entry-item.active .entry-name {
      color: #8d6e52;
    }

    .entry-delete {
      position: absolute;
      top: 7px;
      right: 6px;
      border: 0;
      background: transparent;
      color: var(--soft);
      font-size: 14px;
      line-height: 1;
      padding: 3px 6px;
      cursor: pointer;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .entry-delete:hover {
      color: #b85c5c;
    }

    .entry-date {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .entry-name {
      font-size: 14px;
      line-height: 1.5;
      transition: 0.15s ease;
    }

    .empty {
      font-style: italic;
      color: #a69e93;
      font-size: 13px;
    }

    /* Editor */

    .main {
      min-height: 100vh;
      padding: 70px 9vw 48px;
    }

    .editor {
      max-width: 760px;
      margin: 0 auto;
      min-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 28px;
      color: #7f786e;
      font-size: 13px;
      margin-bottom: 62px;
    }

    .meta input {
      border: 0;
      background: transparent;
      outline: none;
      color: inherit;
      width: 110px;
      flex-shrink: 0;
    }

    .meta input[readonly] {
      cursor: default;
      pointer-events: none;
    }

    .moods {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
    }

    .mood {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 0;
      background: transparent;
      color: inherit;
      opacity: 0.42;
      padding: 2px 6px;
      border-radius: 6px;
      transition: 0.16s;
    }

    .mood:hover,
    .mood.active {
      opacity: 1;
      transform: translateY(-2px);
    }

    .mood-emoji {
      font-size: 17px;
      line-height: 1;
    }

    .mood-label {
      font-size: 11px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .save {
      margin-left: auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 20px;
      background: transparent;
      color: #756d63;
      transition: 0.18s ease;
    }

    .save:hover {
      background: #eee9e0;
    }

    .title-input {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 42px;
      line-height: 1.25;
      margin-bottom: 36px;
      padding: 0;
    }

    .title-input::placeholder {
      color: #c1b8ab;
    }

    .content {
      width: 100%;
      min-height: 430px;
      flex: 1;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: #585149;
      font-size: 18px;
      line-height: 2;
      padding: 0;
    }

    .content::placeholder {
      color: #bdb5a9;
    }

    /* ===== 图片 ===== */
    .images {
      margin: 20px 0 24px;
    }

    .images-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .images-strip:empty {
      display: none;
    }

    .image-item {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.3);
    }

    .image-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }

    .image-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 0;
      background: rgba(64, 59, 53, 0.72);
      color: #fff;
      font-size: 11px;
      line-height: 18px;
      padding: 0;
    }

    .image-new {
      position: absolute;
      top: 2px;
      left: 2px;
      background: #9b8063;
      color: #fff;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      pointer-events: none;
    }

    .add-image {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.5px;
      padding: 0;
      transition: color 0.15s;
    }

    .add-image:hover {
      color: var(--text);
    }

    /* ===== 附件 ===== */
    .atts-strip {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 12px 0 10px;
    }

    .atts-strip:empty {
      display: none;
    }

    .att-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text);
      max-width: 460px;
    }

    .att-row .att-name {
      flex: 1;
      color: #8d6e52;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .att-row .att-name:hover {
      text-decoration: underline;
    }

    .att-row .att-name-static {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .att-remove {
      border: 0;
      background: transparent;
      color: var(--soft);
      font-size: 14px;
      line-height: 1;
      padding: 2px 6px;
      cursor: pointer;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .att-remove:hover {
      color: #b85c5c;
    }

    .att-new-badge {
      background: #9b8063;
      color: #fff;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .image-overlay {
      position: fixed;
      inset: 0;
      background: rgba(36, 28, 18, 0.82);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
      padding: 24px;
    }

    .image-overlay-img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .footer {
      border-top: 1px solid var(--line);
      padding-top: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .tag-options {
      display: flex;
      gap: 8px;
      flex: 1;
    }

    .tag-option {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 14px;
      transition: 0.15s ease;
    }

    .tag-option:hover {
      background: #eee9e0;
      color: var(--text);
    }

    .tag-option.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .word-count {
      white-space: nowrap;
      font-size: 12px;
    }

    .saved-tip {
      position: fixed;
      right: 30px;
      bottom: 28px;
      padding: 9px 17px;
      border-radius: 999px;
      background: rgba(69, 64, 57, 0.9);
      color: white;
      font-size: 12px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: 0.2s ease;
    }

    .saved-tip.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 850px) {
      .config-toggle {
        display: block;
      }

      .config-inputs {
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .config-inputs.open {
        display: flex;
      }

      .config-field input {
        flex: 1;
        width: auto;
      }

      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        min-height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding: 24px 20px;
      }

      .main {
        padding: 24px 18px 48px;
      }

      .meta {
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }

      .moods {
        order: 3;
        flex-basis: 100%;
        gap: 6px;
      }

      .mood {
        padding: 5px 8px;
      }

      .save {
        margin-left: auto;
      }

      .title-input {
        font-size: 28px;
        margin-bottom: 20px;
      }

      .content {
        font-size: 16px;
      }

      .search {
        font-size: 16px;
      }

      .calendar-nav button {
        padding: 6px 8px;
        font-size: 20px;
      }
    }

    @media (min-width: 851px) {
      body {
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .config-bar {
        flex-shrink: 0;
      }

      .app {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .sidebar {
        min-height: 0;
        overflow-y: auto;
      }

      .main {
        min-height: 0;
        overflow: hidden;
        padding: 24px 3vw 24px;
      }

      .editor {
        max-width: 900px;
        height: 100%;
        min-height: 0;
      }

      .meta {
        gap: 20px;
        margin-bottom: 18px;
      }

      .moods {
        gap: 6px;
      }

      .mood {
        font-size: 17px;
      }

      .title-input {
        font-size: 36px;
        margin-bottom: 20px;
      }

      .content {
        min-height: 0;
        font-size: 17px;
      }

      .images {
        margin: 14px 0 16px;
      }

      .footer {
        padding-top: 14px;
      }
    }
  </style>
</head>

<body>
  <!-- 配置栏 -->
  <div class="config-bar">
    <button class="config-toggle" id="configToggle" title="配置">⚙</button>
    <div class="config-inputs" id="configInputs">
      <label class="config-field">
        <span>Notion Token</span>
        <input type="password" id="notion-token" placeholder="secret_…" />
      </label>
      <label class="config-field">
        <span>Database ID</span>
        <input type="text" id="diary-notion-db" placeholder="Diary 数据库 ID" />
      </label>
      <label class="config-field">
        <span>Cloud Name</span>
        <input type="text" id="cloudinary-cloud" placeholder="Cloud Name" />
      </label>
      <label class="config-field">
        <span>Preset</span>
        <input type="text" id="cloudinary-preset" placeholder="Preset" />
      </label>
    </div>
    <span class="config-status" id="notion-status">未连接</span>
    <button class="config-test" id="testNotionBtn">测试连接</button>
    <button class="config-test" onclick="location.href='./index.html'">← 拾光</button>
  </div>

  <div class="app">

    <aside class="sidebar">
      <input
        id="search"
        class="search"
        placeholder="⌕  Search memories..."
      />

      <div class="calendar-header">
        <div id="calendarTitle" class="calendar-title"></div>

        <div class="calendar-nav">
          <button id="prevMonth">‹</button>
          <button id="nextMonth">›</button>
        </div>
      </div>

      <div class="weekdays">
        <div>S</div>
        <div>M</div>
        <div>T</div>
        <div>W</div>
        <div>T</div>
        <div>F</div>
        <div>S</div>
      </div>

      <div id="calendarDays" class="days"></div>

      <div class="month-entries">
        <div class="entries-title">This month</div>
        <div id="entriesList"></div>
      </div>
    </aside>

    <main class="main">
      <div class="editor">

        <div class="meta">
          <input id="dateInput" type="date" readonly />
          <input id="timeInput" type="time" readonly />

          <div class="moods">
            <button class="mood" data-mood="开心"><span class="mood-emoji">😄</span><span class="mood-label">开心</span></button>
            <button class="mood" data-mood="思考"><span class="mood-emoji">🤔</span><span class="mood-label">思考</span></button>
            <button class="mood" data-mood="兴奋"><span class="mood-emoji">🤩</span><span class="mood-label">兴奋</span></button>
            <button class="mood" data-mood="焦虑"><span class="mood-emoji">😟</span><span class="mood-label">焦虑</span></button>
            <button class="mood" data-mood="低落"><span class="mood-emoji">😔</span><span class="mood-label">低落</span></button>
            <button class="mood" data-mood="生气"><span class="mood-emoji">😡</span><span class="mood-label">生气</span></button>
            <button class="mood" data-mood="成长"><span class="mood-emoji">🌱</span><span class="mood-label">成长</span></button>
            <button class="mood" data-mood="灵感"><span class="mood-emoji">💡</span><span class="mood-label">灵感</span></button>
          </div>

          <button id="saveBtn" class="save">Save</button>
        </div>

        <input
          id="titleInput"
          class="title-input"
          placeholder="给今天取个名字……"
        />

        <textarea
          id="contentInput"
          class="content"
          placeholder="今天发生了什么，心里在想什么……"
        ></textarea>

        <div class="images">
          <div class="images-strip" id="imagesStrip"></div>
          <button class="add-image" id="addImageBtn">＋ 图片</button>
          <input type="file" id="imageFileInput" accept="image/*" multiple hidden />

          <div class="atts-strip" id="attsStrip"></div>
          <button class="add-image" id="addAttBtn">＋ 文件</button>
          <input type="file" id="attFileInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.md,.csv,.zip" multiple hidden />
        </div>

        <div class="footer">
          <span>Tags:</span>

          <div class="tag-options">
            <button class="tag-option" data-tag="日记">日记</button>
            <button class="tag-option" data-tag="随笔">随笔</button>
          </div>

          <span id="wordCount" class="word-count">0 字</span>
        </div>

      </div>
    </main>

  </div>

  <div id="savedTip" class="saved-tip">Saved</div>

  <div id="imageOverlay" class="image-overlay" style="display: none">
    <img id="imageOverlayImg" class="image-overlay-img" src="" alt="" />
  </div>

  <script>
    // ===== Notion / Cloudinary 配置 =====
    const notionToken = document.getElementById('notion-token')
    const notionDb = document.getElementById('diary-notion-db')
    const cloudinaryCloud = document.getElementById('cloudinary-cloud')
    const cloudinaryPreset = document.getElementById('cloudinary-preset')
    const notionStatus = document.getElementById('notion-status')

    const PROXY_BASE = 'https://shiguang-proxy.hazel3248627535.workers.dev/v1'

    function loadConfig() {
      notionToken.value = localStorage.getItem('notion_token') || ''
      notionDb.value = localStorage.getItem('diary_notion_db') || ''
      cloudinaryCloud.value = localStorage.getItem('cloudinary_cloud') || ''
      cloudinaryPreset.value = localStorage.getItem('cloudinary_preset') || ''
    }

    function saveConfig() {
      localStorage.setItem('notion_token', notionToken.value.trim())
      localStorage.setItem('diary_notion_db', notionDb.value.trim())
      localStorage.setItem('cloudinary_cloud', cloudinaryCloud.value.trim())
      localStorage.setItem('cloudinary_preset', cloudinaryPreset.value.trim())
    }

    ;[notionToken, notionDb, cloudinaryCloud, cloudinaryPreset].forEach(el =>
      el.addEventListener('input', saveConfig)
    )

    document.getElementById('configToggle').onclick = () => {
      document.getElementById('configInputs').classList.toggle('open')
    }

    function getHeaders() {
      return {
        Authorization: 'Bearer ' + notionToken.value.trim(),
        'Notion-Version': '2022-06-28',
        'Content-Type': 'application/json',
      }
    }

    function getCloudinaryConfig() {
      return {
        cloud: cloudinaryCloud.value.trim(),
        preset: cloudinaryPreset.value.trim(),
      }
    }

    // ===== 数据 =====
    let entries = {}
    let currentImages = []
    let newImageFiles = []

    // 附件状态
    // 5 MiB = 免费版 Notion 工作区的单文件上传硬限制（官方 max_file_upload_size_in_bytes = 5242880），
    // 超过会被 Notion 拒绝。注意：20 MiB 只是 API single_part / multi_part 的分界线，
    // 并不代表免费版能传 20MB。付费版上限为 5 GiB。
    const MAX_ATT_SIZE = 5 * 1024 * 1024 // 单文件最大 5MiB

    // ===== Notion 查询 / 解析 =====
    async function queryNotion(dbId, cursor) {
      const body = {
        page_size: 100,
        sorts: [{ timestamp: 'created_time', direction: 'descending' }],
      }
      if (cursor) body.start_cursor = cursor
      const res = await fetch(PROXY_BASE + '/databases/' + dbId + '/query', {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify(body),
      })
      if (!res.ok) throw new Error('query failed ' + res.status)
      return res.json()
    }

    async function fetchAllPages(dbId) {
      let results = []
      let cursor
      do {
        const data = await queryNotion(dbId, cursor)
        results = results.concat(data.results || [])
        cursor = data.has_more ? data.next_cursor : undefined
      } while (cursor)
      return results
    }

    function textOf(props, key) {
      const p = props[key]
      if (!p) return ''
      if (p.rich_text) return p.rich_text.map(r => r.plain_text).join('')
      if (p.title) return p.title.map(r => r.plain_text).join('')
      if (p.select) return (p.select && p.select.name) || ''
      if (p.multi_select) return p.multi_select.map(s => s.name).join(', ')
      return ''
    }

    function parseNotionPage(page) {
      const props = page.properties || {}

      let date = ''
      let time = ''
      const dProp = props['日期']
      if (dProp) {
        if (dProp.date && dProp.date.start) {
          const start = dProp.date.start
          date = start.slice(0, 10)
          if (start.length >= 16) time = start.slice(11, 16)
        } else {
          date = textOf(props, '日期')
        }
      }

      let images = []
      const imgProp = props['图片']
      if (imgProp && Array.isArray(imgProp.files)) {
        images = imgProp.files
          .map(f => ({
            url: (f.external && f.external.url) || (f.file && f.file.url) || '',
            name: f.name || '',
          }))
          .filter(i => i.url)
      }

      // 附件：kind 标记来源，external = 外部链接，file = Notion 托管文件
      let attachments = []
      const attProp = props['附件']
      if (attProp && Array.isArray(attProp.files)) {
        attachments = attProp.files
          .map(f => {
            if (f.external && f.external.url) return { url: f.external.url, name: f.name || '', kind: 'external' }
            if (f.file && f.file.url) return { url: f.file.url, name: f.name || '', kind: 'file' }
            return null
          })
          .filter(Boolean)
      }

      return {
        id: page.id,
        date,
        time,
        title: textOf(props, '名称'),
        mood: textOf(props, '心情'),
        tags: textOf(props, '标签').split(',').map(t => t.trim()).filter(Boolean),
        images,
        attachments,
      }
    }

    // ===== 正文存为页面 blocks =====
    function contentToBlocks(content) {
      if (!content) return []
      return content.split('\n').map(line => {
        const rich_text = []
        if (line) {
          for (let i = 0; i < line.length; i += 2000) {
            rich_text.push({ type: 'text', text: { content: line.slice(i, i + 2000) } })
          }
        }
        return { object: 'block', type: 'paragraph', paragraph: { rich_text } }
      })
    }

    function blocksToContent(blocks) {
      return (blocks || [])
        .filter(b => b.type === 'paragraph')
        .map(b => (b.paragraph.rich_text || []).map(r => r.plain_text).join(''))
        .join('\n')
    }

    async function getBlocks(pageId) {
      let results = []
      let cursor
      do {
        let url = PROXY_BASE + '/blocks/' + pageId + '/children?page_size=100'
        if (cursor) url += '&start_cursor=' + encodeURIComponent(cursor)
        const res = await fetch(url, { headers: getHeaders() })
        if (!res.ok) throw new Error('get blocks failed ' + res.status)
        const data = await res.json()
        results = results.concat(data.results || [])
        cursor = data.has_more ? data.next_cursor : undefined
      } while (cursor)
      return results
    }

    async function appendBlocks(pageId, children) {
      const res = await fetch(PROXY_BASE + '/blocks/' + pageId + '/children', {
        method: 'PATCH',
        headers: getHeaders(),
        body: JSON.stringify({ children }),
      })
      if (!res.ok) throw new Error('append blocks failed ' + res.status)
    }

    async function deleteBlock(blockId) {
      const res = await fetch(PROXY_BASE + '/blocks/' + blockId, {
        method: 'DELETE',
        headers: getHeaders(),
      })
      if (!res.ok) throw new Error('delete block failed ' + res.status)
    }

    async function replacePageBlocks(pageId, content) {
      let existing = []
      try {
        existing = await getBlocks(pageId)
      } catch (e) {
        // 读不到旧块则忽略，继续追加
      }
      if (existing.length) {
        await Promise.all(existing.map(b => deleteBlock(b.id)))
      }
      const blocks = contentToBlocks(content)
      if (blocks.length) {
        await appendBlocks(pageId, blocks)
      }
    }

    // ===== 附件（Notion File Upload API，经 Worker 代理）=====
    function attIcon(name) {
      const ext = (String(name || '').split('.').pop() || '').toLowerCase()
      const map = {
        pdf: '📄', doc: '📝', docx: '📝',
        xls: '📊', xlsx: '📊', csv: '📊',
        ppt: '📽️', pptx: '📽️',
        txt: '📃', md: '📑', zip: '🗜️',
      }
      return map[ext] || '📎'
    }

    function attExt(name) {
      const s = String(name || '')
      const i = s.lastIndexOf('.')
      return i >= 0 ? s.slice(i + 1).toLowerCase() : ''
    }

    // 纯文本文件白名单：只有这些后缀会在上传前被读取/补 UTF-8 BOM。
    // 其余（PDF/Word/Excel/PPT/ZIP/图片等）一律视为二进制，完全不处理。
    const TEXT_ATT_EXTS = ['md', 'markdown', 'txt', 'text', 'csv', 'tsv', 'log']

    function isTextAtt(file) {
      return TEXT_ATT_EXTS.indexOf(attExt(file.name)) >= 0
    }

    // 纯文本文件的 MIME 强制带 charset=utf-8，帮助 Notion 按 UTF-8 解码预览
    const TEXT_ATT_MIME = {
      md: 'text/markdown; charset=utf-8',
      markdown: 'text/markdown; charset=utf-8',
      txt: 'text/plain; charset=utf-8',
      text: 'text/plain; charset=utf-8',
      csv: 'text/csv; charset=utf-8',
      tsv: 'text/tab-separated-values; charset=utf-8',
      log: 'text/plain; charset=utf-8',
    }

    function attContentType(file) {
      const ext = attExt(file.name)
      // 纯文本：忽略浏览器给的 file.type，统一带 charset=utf-8
      if (TEXT_ATT_MIME[ext]) return TEXT_ATT_MIME[ext]
      if (file.type) return file.type
      const map = {
        pdf: 'application/pdf',
        doc: 'application/msword',
        docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
        xls: 'application/vnd.ms-excel',
        xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
        ppt: 'application/vnd.ms-powerpoint',
        pptx: 'application/vnd.openxmlformats-officedocument.presentationml.presentation',
        zip: 'application/zip',
      }
      return map[ext] || 'application/octet-stream'
    }

    // 纯文本文件上传前确保带 UTF-8 BOM（EF BB BF）
    // · 非文本文件（PDF/Word/Excel/PPT/ZIP/图片…）→ 原样返回，不读不写不处理
    // · 已有 BOM → 不补字节，仅把 MIME 归一成带 charset=utf-8 的形式
    // · 没有 BOM → 只在最前面补 3 个字节
    // 文件名始终保持不变
    async function withUtf8Bom(file) {
      if (!isTextAtt(file)) return file
      const bytes = new Uint8Array(await file.arrayBuffer())
      const hasBom = bytes.length >= 3 && bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf
      const type = attContentType(file)
      const out = hasBom
        ? new File([bytes], file.name, { type })
        : new File([new Uint8Array([0xef, 0xbb, 0xbf]), bytes], file.name, { type })
      console.log('[附件] ' + file.name + ' 文本文件 · ' + (hasBom ? '已有 BOM（原样）' : '已补 UTF-8 BOM') + ' · content_type=' + type)
      return out
    }

    // Notion File Upload API 版本（只用于附件上传这两个请求，
    // 避免升级后影响现有 databases/pages/blocks 的调用行为）
    const NOTION_UPLOAD_VERSION = '2026-03-11'

    // 附件上传专用请求头
    // withJson = true  → 第一步 create：带 Content-Type: application/json
    // withJson = false → 第二步 send：绝对不带 Content-Type，由浏览器生成 multipart boundary
    function getUploadHeaders(withJson) {
      const headers = {
        Authorization: 'Bearer ' + notionToken.value.trim(),
        'Notion-Version': NOTION_UPLOAD_VERSION,
      }
      if (withJson) headers['Content-Type'] = 'application/json'
      return headers
    }

    // 读取 Notion 错误信息（含 code，方便定位 invalid_json 之类的问题）
    async function notionErrorMessage(res) {
      let msg = 'HTTP ' + res.status
      try {
        const err = await res.json()
        if (err && err.message) msg = err.message + (err.code ? '（' + err.code + '）' : '')
      } catch (e) {}
      return msg
    }

    // 把保存失败的 Notion 报错翻译成可操作的提示
    function saveErrorTip(err, res) {
      const msg = (err && err.message) || String(res && res.status)
      // 日记库还没建「附件」字段时最常见：validation_error + "附件 is not a property that exists."
      if (err && err.code === 'validation_error' && msg.indexOf('附件') >= 0) {
        alert(
          '日记数据库里还没有「附件」字段，所以带附件的保存会被拒绝。\n\n' +
            '请在 Notion 的日记数据库中新增一个属性：\n' +
            '· 名称：附件（三个字，必须一模一样）\n' +
            '· 类型：Files & media\n\n' +
            '建好后再点一次保存即可，已选好的文件不会丢。'
        )
        return '缺少「附件」字段'
      }
      return '保存失败：' + msg
    }

    // 上传单个附件：创建 file upload → 发送文件内容 → 返回 {id, name}
    async function uploadAttToNotion(rawFile) {
      // 纯文本文件（.md/.txt/.csv 等）先补 UTF-8 BOM 再上传；二进制文件原样透传
      const file = await withUtf8Bom(rawFile)

      // ===== 第 1 步：创建 File Upload（必须是 JSON，不能是 FormData）=====
      const createRes = await fetch(PROXY_BASE + '/file_uploads', {
        method: 'POST',
        headers: getUploadHeaders(true),
        body: JSON.stringify({
          mode: 'single_part',
          filename: file.name,
          content_type: attContentType(file),
        }),
      })
      if (!createRes.ok) {
        throw new Error('「' + file.name + '」第 1 步创建上传失败（/v1/file_uploads）：' + (await notionErrorMessage(createRes)))
      }
      const fu = await createRes.json()
      if (!fu || !fu.id) {
        throw new Error('「' + file.name + '」第 1 步创建上传失败：响应里没有 file_upload id')
      }

      // ===== 第 2 步：发送文件内容（multipart/form-data，手动设置 Content-Type 会破坏 boundary）=====
      const formData = new FormData()
      formData.append('file', file, file.name)
      const sendRes = await fetch(PROXY_BASE + '/file_uploads/' + fu.id + '/send', {
        method: 'POST',
        headers: getUploadHeaders(false),
        body: formData,
      })
      if (!sendRes.ok) {
        const msg = await notionErrorMessage(sendRes)
        const hint =
          msg.indexOf('invalid_json') >= 0
            ? '（提示：说明 Worker 把 /file_uploads/{id}/send 的 Content-Type 改写成了 application/json，需在 Worker 里原样透传 multipart）'
            : ''
        throw new Error('「' + file.name + '」第 2 步发送文件失败（/v1/file_uploads/{id}/send）：' + msg + hint)
      }

      return { id: fu.id, name: file.name }
    }

    // 从保存/创建页面响应中解析「附件」属性（拿到 Notion 生成的真实下载 URL）
    function parseAttProp(prop) {
      if (!prop || !Array.isArray(prop.files)) return []
      return prop.files
        .map(f => {
          if (f.external && f.external.url) return { url: f.external.url, name: f.name || '', kind: 'external' }
          if (f.file && f.file.url) return { url: f.file.url, name: f.name || '', kind: 'file' }
          return null
        })
        .filter(Boolean)
    }

    function attRow(att, kind) {
      const row = document.createElement('div')
      row.className = 'att-row'

      const icon = document.createElement('span')
      icon.textContent = attIcon(att.name)

      const name = document.createElement(kind === 'current' ? 'a' : 'span')
      if (kind === 'current') {
        name.className = 'att-name'
        name.href = att.url
        name.target = '_blank'
        name.rel = 'noopener'
        name.title = '打开/下载文件'
      } else {
        name.className = 'att-name-static'
      }
      name.textContent = att.name
      name.title = att.name

      row.appendChild(icon)
      row.appendChild(name)

      if (kind === 'new') {
        const badge = document.createElement('span')
        badge.className = 'att-new-badge'
        badge.textContent = '新'
        row.appendChild(badge)
      }

      const del = document.createElement('button')
      del.className = 'att-remove'
      del.textContent = '×'
      del.title = '移除'
      del.onclick = e => {
        e.stopPropagation()
        if (kind === 'current') currentAtts.splice(Number(row.dataset.index), 1)
        else newAttFiles.splice(Number(row.dataset.index), 1)
        renderAtts()
      }
      row.appendChild(del)

      return row
    }

    function renderAtts() {
      attsStrip.innerHTML = ''
      currentAtts.forEach((a, i) => {
        const row = attRow(a, 'current')
        row.dataset.index = i
        attsStrip.appendChild(row)
      })
      newAttFiles.forEach((f, i) => {
        const row = attRow({ name: f.name }, 'new')
        row.dataset.index = i
        attsStrip.appendChild(row)
      })
    }

    document.getElementById('attFileInput').addEventListener('change', e => {

        alert('以下文件超过 ' + MAX_ATT_SIZE_MB + 'MB，已跳过：\n' + tooBig.map(f => '• ' + f.name).join('\n'))
      }
      newAttFiles = newAttFiles.concat(files.filter(f => f.size <= MAX_ATT_SIZE))
      renderAtts()
      e.target.value = ''
    })

    function imageItem(src, name, kind, index) {
      const div = document.createElement('div')
      div.className = 'image-item'
      const img = document.createElement('img')
      img.src = src
      img.alt = name || ''
      img.onclick = e => {
        e.stopPropagation()
        showImageOverlay(src)
      }
      const del = document.createElement('button')
      del.className = 'image-remove'
      del.textContent = '×'
      del.title = '移除'
      del.onclick = e => {
        e.stopPropagation()
        if (kind === 'current') currentImages.splice(index, 1)
        else newImageFiles.splice(index, 1)
        renderImages()
      }
      div.appendChild(img)
      div.appendChild(del)
      if (kind === 'new') {
        const badge = document.createElement('span')
        badge.className = 'image-new'
        badge.textContent = '新'
        div.appendChild(badge)
      }
      return div
    }

    function renderImages() {
      imagesStrip.querySelectorAll('img').forEach(img => {
        if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src)
      })
      imagesStrip.innerHTML = ''
      currentImages.forEach((img, i) =>
        imagesStrip.appendChild(imageItem(img.url, img.name, 'current', i))
      )
      newImageFiles.forEach((file, i) =>
        imagesStrip.appendChild(imageItem(URL.createObjectURL(file), file.name, 'new', i))
      )
    }

    document.getElementById('addImageBtn').onclick = () =>
      document.getElementById('imageFileInput').click()

    document.getElementById('imageFileInput').addEventListener('change', e => {
      newImageFiles = newImageFiles.concat(Array.from(e.target.files))
      renderImages()
      e.target.value = ''
    })

    function extractImagesFromPaste(e) {
      const items = e.clipboardData && e.clipboardData.items
      if (!items) return []
      const files = []
      for (const item of items) {
        if (item.type && item.type.startsWith('image/')) {
          const file = item.getAsFile()
          if (file) files.push(file)
        }
      }
      return files
    }

    document.addEventListener('paste', e => {
      if (e.target && e.target.id === 'contentInput') {
        const files = extractImagesFromPaste(e)
        if (files.length) {
          e.preventDefault()
          newImageFiles = newImageFiles.concat(files)
          renderImages()
        }
      }
    })

    function showImageOverlay(src) {

      document.getElementById('imageOverlay').style.display = 'none'

    // ===== 日历 =====
    function renderCalendar() {
      calendarDays.innerHTML = ''

      calendarTitle.textContent =
        `${currentYear} · ${String(currentMonth + 1).padStart(2, '0')}`

      const firstDay = new Date(currentYear, currentMonth, 1).getDay()
      const daysInMonth = new Date(
        currentYear,
        currentMonth + 1,
        0
      ).getDate()

      const prevMonthDays = new Date(
        currentYear,
        currentMonth,
        0
      ).getDate()

      for (let i = firstDay - 1; i >= 0; i--) {
        const el = document.createElement('div')
        el.className = 'day other'
        el.textContent = prevMonthDays - i
        calendarDays.appendChild(el)
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const date = `${currentYear}-${String(currentMonth + 1).padStart(
          2,
          '0'
        )}-${String(day).padStart(2, '0')}`

        const el = document.createElement('div')

        el.className = 'day'
        el.textContent = day

        if (entries[date]) {
          el.classList.add('has-entry')
        }

        if (date === selectedDate) {
          el.classList.add('selected')
        }

        el.onclick = () => {
          selectedDate = date
          loadEntry(date)
          renderCalendar()
          scrollToEditor()
        }

        calendarDays.appendChild(el)
      }

      renderEntriesList()
    }

    let loadSeq = 0

    async function loadEntry(date) {
      selectedDate = date

      const entry = entries[date]
      const seq = ++loadSeq

      dateInput.value = date

      currentImages = entry && entry.images ? entry.images.slice() : []
      newImageFiles = []
      currentAtts = entry && entry.attachments ? entry.attachments.slice() : []
      newAttFiles = []
      contentInput.value = ''

      if (entry) {
        timeInput.value = entry.time || ''
        titleInput.value = entry.title || ''
        setSelectedTags(entry.tags)

        document.querySelectorAll('.mood').forEach(btn => {
          btn.classList.toggle(
            'active',
            btn.dataset.mood === entry.mood
          )
        })

        if (entry.id) {
          try {
            const blocks = await getBlocks(entry.id)
            if (seq === loadSeq) {
              const text = blocksToContent(blocks)
              entry.content = text
              contentInput.value = text
            }
          } catch (e) {
            if (seq === loadSeq) contentInput.value = ''
          }
        }
      } else {
        timeInput.value = formatTime(new Date())

        titleInput.value = ''
        setSelectedTags(['日记'])

        document
          .querySelectorAll('.mood')
          .forEach(btn => btn.classList.remove('active'))
      }

      renderImages()
      renderAtts()
      updateWordCount()
    }

    // ===== 保存（Notion upsert）=====
    async function saveEntry() {
      const date = dateInput.value
      if (!date) return

      const token = notionToken.value.trim()
      const db = notionDb.value.trim()
      if (!token || !db) {
        showTip('请先配置 Notion')
        return
      }

      let uploaded = []
      if (newImageFiles.length) {
        const cfg = getCloudinaryConfig()
        if (!cfg.cloud || !cfg.preset) {
          showTip('请先配置 Cloudinary')
          return
        }
        saveBtn.textContent = '上传中…'
        try {
          uploaded = await Promise.all(newImageFiles.map(uploadToCloudinary))
        } catch (e) {
          showTip('图片上传失败')
          saveBtn.textContent = 'Save'
          return
        }
      }

      const allImages = currentImages.concat(uploaded)

      // 上传新增附件（Notion File Upload API）
      let uploadedAtts = []
      if (newAttFiles.length) {
        saveBtn.textContent = '上传文件中…'
        try {
          for (const f of newAttFiles) {
            uploadedAtts.push(await uploadAttToNotion(f))
          }
        } catch (e) {
          showTip('文件上传失败：' + e.message)
          saveBtn.textContent = 'Save'
          return
        }
      }
      // kind: upload = 本次刚上传（还没有 URL），保存后从响应里解析真实 URL
      const allAtts = currentAtts.concat(uploadedAtts.map(u => ({ name: u.name, id: u.id, kind: 'upload' })))

      const mood = document.querySelector('.mood.active')?.dataset.mood || ''
      const title = titleInput.value.trim() || '无题'
      const content = contentInput.value
      const tags = getSelectedTags()

      const startDateTime = timeInput.value ? date + 'T' + timeInput.value + ':00' : date
      const properties = {
        名称: { title: [{ text: { content: title } }] },
        日期: { date: { start: startDateTime } },
        标签: { multi_select: tags.map(t => ({ name: t })) },
        图片: { files: allImages.map(img => ({ name: img.name, external: { url: img.url } })) },
      }
      if (mood) properties['心情'] = { select: { name: mood } }
      // 只在有附件时写入「附件」，避免数据库还没有该字段时保存报错
      if (allAtts.length) {
        properties['附件'] = {
          files: allAtts.map(a =>
            a.kind === 'external'
              ? { name: a.name, external: { url: a.url } }
              : a.kind === 'file'
                ? { name: a.name, type: 'file', file: { url: a.url } }
                : { name: a.name, type: 'file_upload', file_upload: { id: a.id } }
          ),
        }
      }

      saveBtn.textContent = '保存中…'
      try {
        const existing = entries[date]
        let page
        if (existing && existing.id) {
          const res = await fetch(PROXY_BASE + '/pages/' + existing.id, {
            method: 'PATCH',
            headers: getHeaders(),
            body: JSON.stringify({ properties }),
          })
          if (!res.ok) {
            const err = await res.json()
            showTip(saveErrorTip(err, res))
            saveBtn.textContent = 'Save'
            return
          }
          page = await res.json()
          await replacePageBlocks(existing.id, content)
        } else {
          const body = { parent: { database_id: db }, properties }
          if (content) body.children = contentToBlocks(content)
          const res = await fetch(PROXY_BASE + '/pages', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify(body),
          })
          if (!res.ok) {
            const err = await res.json()
            showTip(saveErrorTip(err, res))
            saveBtn.textContent = 'Save'
            return
          }
          page = await res.json()
        }

        const savedAtts = parseAttProp(page.properties && page.properties['附件'])
        entries[date] = {
          id: page.id,
          date,
          time: timeInput.value,
          title,
          mood,
          content,
          tags,
          images: allImages,
          attachments: savedAtts,
        }
        currentImages = allImages.slice()
        newImageFiles = []
        currentAtts = savedAtts.slice()
        newAttFiles = []
        renderImages()
        renderAtts()
        selectedDate = date
        showTip('Saved')
        renderCalendar()
      } catch (e) {
        showTip('网络错误')
      }
      saveBtn.textContent = 'Save'
    }

    // ===== 删除日记 =====
    async function deleteEntry(date) {
      const entry = entries[date]
      if (!entry || !entry.id) return
      const title = entry.title || '无题'
      if (!confirm('确定删除这篇日记吗？\n\n「' + title + '」')) return

      try {
        const res = await fetch(PROXY_BASE + '/pages/' + entry.id, {
          method: 'PATCH',
          headers: getHeaders(),
          body: JSON.stringify({ archived: true }),
        })
        if (!res.ok) {
          showTip('删除失败：' + res.status)
          return
        }
        delete entries[date]
        if (selectedDate === date) {
          loadEntry(date)
        }
        renderCalendar()
        showTip('已删除')
      } catch (e) {
        showTip('删除失败')
      }
    }

    // ===== 条目列表 / 字数 =====
    function renderEntriesList() {
      const keyword = searchInput.value.trim().toLowerCase()

      const list = Object.values(entries)
        .filter(entry => {
          const date = new Date(entry.date)

          const sameMonth =
            date.getFullYear() === currentYear &&
            date.getMonth() === currentMonth

          if (!sameMonth) return false

          if (!keyword) return true

          const text = [
            entry.title,
            entry.content,
            entry.mood,
            entry.mood ? MOOD_EMOJI[entry.mood] : '',
            ...(entry.tags || [])
          ]
            .join(' ')
            .toLowerCase()

          return text.includes(keyword)
        })
        .sort((a, b) => b.date.localeCompare(a.date))

      entriesList.innerHTML = ''

      if (!list.length) {
        entriesList.innerHTML =
          '<div class="empty">No entries this month.</div>'
        return
      }

      list.forEach(entry => {
        const item = document.createElement('div')
        item.className = 'entry-item'
        if (entry.date === selectedDate) item.classList.add('active')

        const tags = (entry.tags || [])
          .map(tag => `#${esc(tag)}`)
          .join(' · ')

        const moodText = entry.mood
          ? ` · ${MOOD_EMOJI[entry.mood] || ''} ${entry.mood}`
          : ''

        item.innerHTML = `
          <button class="entry-delete" title="删除">×</button>
          <div class="entry-date">
            ${entry.date.slice(5).replace('-', '.')}${entry.time ? ' · ' + entry.time : ''}${moodText}${tags ? ' · ' + tags : ''}
          </div>

          <div class="entry-name">
            ${esc(entry.title || '无题')}
          </div>
        `

        item.querySelector('.entry-delete').onclick = e => {
          e.stopPropagation()
          deleteEntry(entry.date)
        }

        item.onclick = () => {
          selectedDate = entry.date

          const date = new Date(entry.date + 'T00:00:00')

          currentYear = date.getFullYear()
          currentMonth = date.getMonth()

          loadEntry(entry.date)
          renderCalendar()
          scrollToEditor()
        }

        entriesList.appendChild(item)
      })
    }

    function updateWordCount() {
      wordCount.textContent =
        `${contentInput.value.trim().length} 字`
    }

    function showTip(text) {
      const tip = document.getElementById('savedTip')
      tip.textContent = text
      tip.classList.add('show')
      setTimeout(() => {
        tip.classList.remove('show')
      }, 1600)
    }

    function scrollToEditor() {
      if (!window.matchMedia('(max-width: 850px)').matches) return
      const main = document.querySelector('.main')
      if (main) main.scrollIntoView({ behavior: 'smooth', block: 'start' })
    }

    // ===== 标签（随笔 / 日记 二选一）=====
    function getSelectedTags() {
      return Array.from(document.querySelectorAll('.tag-option.active')).map(b => b.dataset.tag)
    }

    function setSelectedTags(tags) {
      const set = new Set(tags || [])
      document.querySelectorAll('.tag-option').forEach(b => {
        b.classList.toggle('active', set.has(b.dataset.tag))
      })
    }

    document.querySelectorAll('.tag-option').forEach(btn => {
      btn.onclick = () => {
        btn.classList.toggle('active')
      }
    })

    // ===== 事件绑定 =====
    document.querySelectorAll('.mood').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.mood').forEach(item => {
          item.classList.remove('active')
        })

        btn.classList.add('active')
      }
    })

    document.getElementById('prevMonth').onclick = () => {
      currentMonth--

      if (currentMonth < 0) {
        currentMonth = 11
        currentYear--
      }

      renderCalendar()
    }

    document.getElementById('nextMonth').onclick = () => {
      currentMonth++

      if (currentMonth > 11) {
        currentMonth = 0
        currentYear++
      }

      renderCalendar()
    }

    document.getElementById('saveBtn').onclick = saveEntry

    searchInput.addEventListener('input', renderEntriesList)

    contentInput.addEventListener('input', updateWordCount)

    dateInput.addEventListener('change', () => {
      selectedDate = dateInput.value

      const date = new Date(selectedDate + 'T00:00:00')

      currentYear = date.getFullYear()
      currentMonth = date.getMonth()

      loadEntry(selectedDate)
      renderCalendar()
    })

    // ===== 初始化 =====
    loadConfig()

    dateInput.value = selectedDate
    timeInput.value = formatTime(today)

    ;(async () => {
      if (notionToken.value.trim() && notionDb.value.trim()) {
        try {
          await loadDiaryEntries()
          notionStatus.textContent = '✓ 已连接'
          notionStatus.className = 'config-status ok'
        } catch (e) {
          notionStatus.textContent = '未连接'
        }
      }
      loadEntry(selectedDate)
      renderCalendar()
    })()
  </script>
</body>
</html>
