<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diary</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f7f4ee;
      --paper: #fbf9f4;
      --line: #ded8cd;
      --text: #403b35;
      --muted: #9b9387;
      --soft: #c8c0b4;
      --accent: #4d4943;
    }

    /* ===== 滚动条 ===== */

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--soft);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    ::-webkit-scrollbar-corner {
      background: transparent;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: var(--soft) transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", "Noto Serif SC", serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ===== 配置栏 ===== */
    .config-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .config-toggle {
      display: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      padding: 4px 10px;
    }

    .config-inputs {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .config-field {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .config-field span {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .config-field input {
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      outline: none;
      color: var(--text);
      padding: 6px 2px;
      font-size: 13px;
      width: 150px;
    }

    .config-status {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .config-status.ok {
      color: #7a8f6b;
    }

    .config-status.err {
      color: #b85c5c;
    }

    .config-test {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      padding: 6px 16px;
      font-size: 12px;
      transition: 0.18s ease;
    }

    .config-test:hover {
      background: #eee9e0;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 330px 1fr;
    }

    /* Sidebar */

    .sidebar {
      min-height: 100vh;
      padding: 34px 30px;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.18);
    }

    .brand {
      margin-bottom: 34px;
    }

    .brand-title {
      margin: 0;
      font-size: 29px;
      font-weight: 400;
      font-style: italic;
      letter-spacing: 2px;
    }

    .brand-subtitle {
      margin-top: 7px;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.5px;
    }

    .search {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      outline: none;
      padding: 10px 2px 12px;
      color: var(--text);
      margin-bottom: 34px;
    }

    .search::placeholder {
      color: #b8b1a7;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 23px;
    }

    .calendar-title {
      letter-spacing: 4px;
      font-size: 16px;
    }

    .calendar-nav {
      display: flex;
      gap: 13px;
    }

    .calendar-nav button {
      border: 0;
      background: transparent;
      color: var(--muted);
      padding: 3px;
      font-size: 18px;
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }

    .weekdays {
      margin-bottom: 10px;
      font-size: 12px;
      color: #aaa297;
    }

    .days {
      row-gap: 10px;
    }

    .day {
      position: relative;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .day:hover {
      background: rgba(76, 72, 65, 0.07);
    }

    .day.other {
      color: #d1cbc1;
    }

    .day.selected {
      background: var(--accent);
      color: white;
    }

    .day.has-entry::after {
      content: "";
      position: absolute;
      bottom: 4px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #9b8063;
    }

    .day.selected::after {
      background: white;
    }

    .month-entries {
      margin-top: 28px;
      border-top: 1px solid var(--line);
      padding-top: 24px;
    }

    .entries-title {
      margin-bottom: 18px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .entry-item {
      position: relative;
      padding: 10px 10px 13px;
      cursor: pointer;
      border-bottom: 1px solid rgba(222, 216, 205, 0.55);
    }

    .entry-item:hover .entry-name {
      color: #8d6e52;
    }

    .entry-item.active {
      background: rgba(76, 72, 65, 0.06);
      border-radius: 8px;
    }

    .entry-item.active .entry-name {
      color: #8d6e52;
    }

    .entry-delete {
      position: absolute;
      top: 7px;
      right: 6px;
      border: 0;
      background: transparent;
      color: var(--soft);
      font-size: 14px;
      line-height: 1;
      padding: 3px 6px;
      cursor: pointer;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .entry-delete:hover {
      color: #b85c5c;
    }

    .entry-date {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .entry-name {
      font-size: 14px;
      line-height: 1.5;
      transition: 0.15s ease;
    }

    .entry-tags {
      margin-top: 5px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 11px;
      color: #a99d90;
    }

    .empty {
      font-style: italic;
      color: #a69e93;
      font-size: 13px;
    }

    /* Editor */

    .main {
      min-height: 100vh;
      padding: 70px 9vw 48px;
    }

    .editor {
      max-width: 760px;
      margin: 0 auto;
      min-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 28px;
      color: #7f786e;
      font-size: 13px;
      margin-bottom: 62px;
    }

    .meta input {
      border: 0;
      background: transparent;
      outline: none;
      color: inherit;
      width: 110px;
      flex-shrink: 0;
    }

    .meta input[readonly] {
      cursor: default;
      pointer-events: none;
    }

    .moods {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex: 1;
    }

    .mood {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 0;
      background: transparent;
      color: inherit;
      opacity: 0.42;
      padding: 2px 6px;
      border-radius: 6px;
      transition: 0.16s;
    }

    .mood:hover,
    .mood.active {
      opacity: 1;
      transform: translateY(-2px);
    }

    .mood-emoji {
      font-size: 17px;
      line-height: 1;
    }

    .mood-label {
      font-size: 11px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .save {
      margin-left: auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 20px;
      background: transparent;
      color: #756d63;
      transition: 0.18s ease;
    }

    .save:hover {
      background: #eee9e0;
    }

    .title-input {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 42px;
      line-height: 1.25;
      margin-bottom: 36px;
      padding: 0;
    }

    .title-input::placeholder {
      color: #c1b8ab;
    }

    .content {
      width: 100%;
      min-height: 430px;
      flex: 1;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: #585149;
      font-size: 18px;
      line-height: 2;
      padding: 0;
    }

    .content::placeholder {
      color: #bdb5a9;
    }

    /* ===== 图片 ===== */
    .images {
      margin: 20px 0 24px;
    }

    .images-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .images-strip:empty {
      display: none;
    }

    .image-item {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.3);
    }

    .image-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }

    .image-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 0;
      background: rgba(64, 59, 53, 0.72);
      color: #fff;
      font-size: 11px;
      line-height: 18px;
      padding: 0;
    }

    .image-new {
      position: absolute;
      top: 2px;
      left: 2px;
      background: #9b8063;
      color: #fff;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      pointer-events: none;
    }

    .add-image {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.5px;
      padding: 0;
      transition: color 0.15s;
    }

    .add-image:hover {
      color: var(--text);
    }

    .image-overlay {
      position: fixed;
      inset: 0;
      background: rgba(36, 28, 18, 0.82);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
      padding: 24px;
    }

    .image-overlay-img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .footer {
      border-top: 1px solid var(--line);
      padding-top: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .tag-options {
      display: flex;
      gap: 8px;
      flex: 1;
    }

    .tag-option {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 14px;
      transition: 0.15s ease;
    }

    .tag-option:hover {
      background: #eee9e0;
      color: var(--text);
    }

    .tag-option.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .word-count {
      white-space: nowrap;
      font-size: 12px;
    }

    .saved-tip {
      position: fixed;
      right: 30px;
      bottom: 28px;
      padding: 9px 17px;
      border-radius: 999px;
      background: rgba(69, 64, 57, 0.9);
      color: white;
      font-size: 12px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: 0.2s ease;
    }

    .saved-tip.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 850px) {
      .config-toggle {
        display: block;
      }

      .config-inputs {
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .config-inputs.open {
        display: flex;
      }

      .config-field input {
        flex: 1;
        width: auto;
      }

      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        min-height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .main {
        padding: 45px 25px;
      }

      .meta {
        gap: 14px;
        flex-wrap: wrap;
      }

      .save {
        margin-left: 0;
      }
    }

    @media (min-width: 851px) {
      body {
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .config-bar {
        flex-shrink: 0;
      }

      .app {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .sidebar {
        min-height: 0;
        overflow-y: auto;
      }

      .main {
        min-height: 0;
        overflow: hidden;
        padding: 24px 3vw 24px;
      }

      .editor {
        max-width: 900px;
        height: 100%;
        min-height: 0;
      }

      .meta {
        gap: 20px;
        margin-bottom: 18px;
      }

      .moods {
        gap: 6px;
      }

      .mood {
        font-size: 17px;
      }

      .title-input {
        font-size: 36px;
        margin-bottom: 20px;
      }

      .content {
        min-height: 0;
        font-size: 17px;
      }

      .images {
        margin: 14px 0 16px;
      }

      .footer {
        padding-top: 14px;
      }
    }
  </style>
</head>

<body>
  <!-- 配置栏 -->
  <div class="config-bar">
    <button class="config-toggle" id="configToggle" title="配置">⚙</button>
    <div class="config-inputs" id="configInputs">
      <label class="config-field">
        <span>Notion Token</span>
        <input type="password" id="notion-token" placeholder="secret_…" />
      </label>
      <label class="config-field">
        <span>Database ID</span>
        <input type="text" id="diary-notion-db" placeholder="Diary 数据库 ID" />
      </label>
      <label class="config-field">
        <span>Cloud Name</span>
        <input type="text" id="cloudinary-cloud" placeholder="Cloud Name" />
      </label>
      <label class="config-field">
        <span>Preset</span>
        <input type="text" id="cloudinary-preset" placeholder="Preset" />
      </label>
    </div>
    <span class="config-status" id="notion-status">未连接</span>
    <button class="config-test" id="testNotionBtn">测试连接</button>
    <button class="config-test" onclick="location.href='./index.html'">← 拾光</button>
  </div>

  <div class="app">

    <aside class="sidebar">
      <div class="brand">
        <h1 class="brand-title">Diary</h1>
        <div class="brand-subtitle">A quiet personal space.</div>
      </div>

      <input
        id="search"
        class="search"
        placeholder="⌕  Search memories..."
      />

      <div class="calendar-header">
        <div id="calendarTitle" class="calendar-title"></div>

        <div class="calendar-nav">
          <button id="prevMonth">‹</button>
          <button id="nextMonth">›</button>
        </div>
      </div>

      <div class="weekdays">
        <div>S</div>
        <div>M</div>
        <div>T</div>
        <div>W</div>
        <div>T</div>
        <div>F</div>
        <div>S</div>
      </div>

      <div id="calendarDays" class="days"></div>

      <div class="month-entries">
        <div class="entries-title">This month</div>
        <div id="entriesList"></div>
      </div>
    </aside>

    <main class="main">
      <div class="editor">

        <div class="meta">
          <input id="dateInput" type="date" readonly />
          <input id="timeInput" type="time" readonly />

          <div class="moods">
            <button class="mood" data-mood="开心"><span class="mood-emoji">😄</span><span class="mood-label">开心</span></button>
            <button class="mood" data-mood="思考"><span class="mood-emoji">🤔</span><span class="mood-label">思考</span></button>
            <button class="mood" data-mood="兴奋"><span class="mood-emoji">🤩</span><span class="mood-label">兴奋</span></button>
            <button class="mood" data-mood="焦虑"><span class="mood-emoji">😟</span><span class="mood-label">焦虑</span></button>
            <button class="mood" data-mood="低落"><span class="mood-emoji">😔</span><span class="mood-label">低落</span></button>
            <button class="mood" data-mood="生气"><span class="mood-emoji">😡</span><span class="mood-label">生气</span></button>
            <button class="mood" data-mood="成长"><span class="mood-emoji">🌱</span><span class="mood-label">成长</span></button>
            <button class="mood" data-mood="灵感"><span class="mood-emoji">💡</span><span class="mood-label">灵感</span></button>
          </div>

          <button id="saveBtn" class="save">Save</button>
        </div>

        <input
          id="titleInput"
          class="title-input"
          placeholder="给今天取个名字……"
        />

        <textarea
          id="contentInput"
          class="content"
          placeholder="今天发生了什么，心里在想什么……"
        ></textarea>

        <div class="images">
          <div class="images-strip" id="imagesStrip"></div>
          <button class="add-image" id="addImageBtn">＋ 图片</button>
          <input type="file" id="imageFileInput" accept="image/*" multiple hidden />
        </div>

        <div class="footer">
          <span>Tags:</span>

          <div class="tag-options">
            <button class="tag-option" data-tag="日记">日记</button>
            <button class="tag-option" data-tag="随笔">随笔</button>
          </div>

          <span id="wordCount" class="word-count">0 字</span>
        </div>

      </div>
    </main>

  </div>

  <div id="savedTip" class="saved-tip">Saved</div>

  <div id="imageOverlay" class="image-overlay" style="display: none">
    <img id="imageOverlayImg" class="image-overlay-img" src="" alt="" />
  </div>

  <script>
    // ===== Notion / Cloudinary 配置 =====
    const notionToken = document.getElementById('notion-token')
    const notionDb = document.getElementById('diary-notion-db')
    const cloudinaryCloud = document.getElementById('cloudinary-cloud')
    const cloudinaryPreset = document.getElementById('cloudinary-preset')
    const notionStatus = document.getElementById('notion-status')

    const PROXY_BASE = 'https://shiguang-proxy.hazel3248627535.workers.dev/v1'

    function loadConfig() {
      notionToken.value = localStorage.getItem('notion_token') || ''
      notionDb.value = localStorage.getItem('diary_notion_db') || ''
      cloudinaryCloud.value = localStorage.getItem('cloudinary_cloud') || ''
      cloudinaryPreset.value = localStorage.getItem('cloudinary_preset') || ''
    }

    function saveConfig() {
      localStorage.setItem('notion_token', notionToken.value.trim())
      localStorage.setItem('diary_notion_db', notionDb.value.trim())
      localStorage.setItem('cloudinary_cloud', cloudinaryCloud.value.trim())
      localStorage.setItem('cloudinary_preset', cloudinaryPreset.value.trim())
    }

    ;[notionToken, notionDb, cloudinaryCloud, cloudinaryPreset].forEach(el =>
      el.addEventListener('input', saveConfig)
    )

    document.getElementById('configToggle').onclick = () => {
      document.getElementById('configInputs').classList.toggle('open')
    }

    function getHeaders() {
      return {
        Authorization: 'Bearer ' + notionToken.value.trim(),
        'Notion-Version': '2022-06-28',
        'Content-Type': 'application/json',
      }
    }

    function getCloudinaryConfig() {
      return {
        cloud: cloudinaryCloud.value.trim(),
        preset: cloudinaryPreset.value.trim(),
      }
    }

    // ===== 数据 =====
    let entries = {}
    let currentImages = []
    let newImageFiles = []

    const today = new Date()

    let currentYear = today.getFullYear()
    let currentMonth = today.getMonth()
    let selectedDate = formatDate(today)

    const dateInput = document.getElementById('dateInput')
    const timeInput = document.getElementById('timeInput')
    const titleInput = document.getElementById('titleInput')
    const contentInput = document.getElementById('contentInput')
    const wordCount = document.getElementById('wordCount')
    const calendarDays = document.getElementById('calendarDays')
    const calendarTitle = document.getElementById('calendarTitle')
    const entriesList = document.getElementById('entriesList')
    const searchInput = document.getElementById('search')
    const saveBtn = document.getElementById('saveBtn')
    const imagesStrip = document.getElementById('imagesStrip')

    function formatDate(date) {
      const y = date.getFullYear()
      const m = String(date.getMonth() + 1).padStart(2, '0')
      const d = String(date.getDate()).padStart(2, '0')
      return `${y}-${m}-${d}`
    }

    function formatTime(date) {
      return `${String(date.getHours()).padStart(2, '0')}:${String(
        date.getMinutes()
      ).padStart(2, '0')}`
    }

    function esc(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
    }

    // ===== Notion 查询 / 解析 =====
    async function queryNotion(dbId, cursor) {
      const body = {
        page_size: 100,
        sorts: [{ timestamp: 'created_time', direction: 'descending' }],
      }
      if (cursor) body.start_cursor = cursor
      const res = await fetch(PROXY_BASE + '/databases/' + dbId + '/query', {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify(body),
      })
      if (!res.ok) throw new Error('query failed ' + res.status)
      return res.json()
    }

    async function fetchAllPages(dbId) {
      let results = []
      let cursor
      do {
        const data = await queryNotion(dbId, cursor)
        results = results.concat(data.results || [])
        cursor = data.has_more ? data.next_cursor : undefined
      } while (cursor)
      return results
    }

    function textOf(props, key) {
      const p = props[key]
      if (!p) return ''
      if (p.rich_text) return p.rich_text.map(r => r.plain_text).join('')
      if (p.title) return p.title.map(r => r.plain_text).join('')
      if (p.select) return (p.select && p.select.name) || ''
      if (p.multi_select) return p.multi_select.map(s => s.name).join(', ')
      return ''
    }

    function parseNotionPage(page) {
      const props = page.properties || {}

      let date = ''
      let time = ''
      const dProp = props['日期']
      if (dProp) {
        if (dProp.date && dProp.date.start) {
          const start = dProp.date.start
          date = start.slice(0, 10)
          if (start.length >= 16) time = start.slice(11, 16)
        } else {
          date = textOf(props, '日期')
        }
      }

      let images = []
      const imgProp = props['图片']
      if (imgProp && Array.isArray(imgProp.files)) {
        images = imgProp.files
          .map(f => ({
            url: (f.external && f.external.url) || (f.file && f.file.url) || '',
            name: f.name || '',
          }))
          .filter(i => i.url)
      }

      return {
        id: page.id,
        date,
        time,
        title: textOf(props, '名称'),
        mood: textOf(props, '心情'),
        tags: textOf(props, '标签').split(',').map(t => t.trim()).filter(Boolean),
        images,
      }
    }

    // ===== 正文存为页面 blocks =====
    function contentToBlocks(content) {
      if (!content) return []
      return content.split('\n').map(line => {
        const rich_text = []
        if (line) {
          for (let i = 0; i < line.length; i += 2000) {
            rich_text.push({ type: 'text', text: { content: line.slice(i, i + 2000) } })
          }
        }
        return { object: 'block', type: 'paragraph', paragraph: { rich_text } }
      })
    }

    function blocksToContent(blocks) {
      return (blocks || [])
        .filter(b => b.type === 'paragraph')
        .map(b => (b.paragraph.rich_text || []).map(r => r.plain_text).join(''))
        .join('\n')
    }

    async function getBlocks(pageId) {
      let results = []
      let cursor
      do {
        let url = PROXY_BASE + '/blocks/' + pageId + '/children?page_size=100'
        if (cursor) url += '&start_cursor=' + encodeURIComponent(cursor)
        const res = await fetch(url, { headers: getHeaders() })
        if (!res.ok) throw new Error('get blocks failed ' + res.status)
        const data = await res.json()
        results = results.concat(data.results || [])
        cursor = data.has_more ? data.next_cursor : undefined
      } while (cursor)
      return results
    }

    async function appendBlocks(pageId, children) {
      const res = await fetch(PROXY_BASE + '/blocks/' + pageId + '/children', {
        method: 'PATCH',
        headers: getHeaders(),
        body: JSON.stringify({ children }),
      })
      if (!res.ok) throw new Error('append blocks failed ' + res.status)
    }

    async function deleteBlock(blockId) {
      const res = await fetch(PROXY_BASE + '/blocks/' + blockId, {
        method: 'DELETE',
        headers: getHeaders(),
      })
      if (!res.ok) throw new Error('delete block failed ' + res.status)
    }

    async function replacePageBlocks(pageId, content) {
      let existing = []
      try {
        existing = await getBlocks(pageId)
      } catch (e) {
        // 读不到旧块则忽略，继续追加
      }
      if (existing.length) {
        await Promise.all(existing.map(b => deleteBlock(b.id)))
      }
      const blocks = contentToBlocks(content)
      if (blocks.length) {
        await appendBlocks(pageId, blocks)
      }
    }

    async function loadDiaryEntries() {
      const db = notionDb.value.trim()
      if (!db) return
      const pages = await fetchAllPages(db)
      const next = {}
      pages.forEach(page => {
        const e = parseNotionPage(page)
        if (e.date) next[e.date] = e
      })
      entries = next
    }

    async function testNotion() {
      const token = notionToken.value.trim()
      const db = notionDb.value.trim()
      if (!token || !db) {
        notionStatus.textContent = '请填写 Token 和 Database ID'
        notionStatus.className = 'config-status err'
        return
      }
      notionStatus.textContent = '连接中…'
      notionStatus.className = 'config-status'
      try {
        await loadDiaryEntries()
        notionStatus.textContent = '✓ 已连接'
        notionStatus.className = 'config-status ok'
        renderCalendar()
        loadEntry(selectedDate)
      } catch (e) {
        notionStatus.textContent = '✗ 连接失败'
        notionStatus.className = 'config-status err'
      }
    }

    document.getElementById('testNotionBtn').onclick = testNotion

    // ===== 图片 =====
    async function uploadToCloudinary(file) {
      const cfg = getCloudinaryConfig()
      const fd = new FormData()
      fd.append('file', file)
      fd.append('upload_preset', cfg.preset)
      const res = await fetch(
        'https://api.cloudinary.com/v1_1/' + cfg.cloud + '/image/upload',
        { method: 'POST', body: fd }
      )
      if (!res.ok) throw new Error('upload failed ' + res.status)
      const data = await res.json()
      return { url: data.secure_url, name: file.name }
    }

    function imageItem(src, name, kind, index) {
      const div = document.createElement('div')
      div.className = 'image-item'
      const img = document.createElement('img')
      img.src = src
      img.alt = name || ''
      img.onclick = e => {
        e.stopPropagation()
        showImageOverlay(src)
      }
      const del = document.createElement('button')
      del.className = 'image-remove'
      del.textContent = '×'
      del.title = '移除'
      del.onclick = e => {
        e.stopPropagation()
        if (kind === 'current') currentImages.splice(index, 1)
        else newImageFiles.splice(index, 1)
        renderImages()
      }
      div.appendChild(img)
      div.appendChild(del)
      if (kind === 'new') {
        const badge = document.createElement('span')
        badge.className = 'image-new'
        badge.textContent = '新'
        div.appendChild(badge)
      }
      return div
    }

    function renderImages() {
      imagesStrip.querySelectorAll('img').forEach(img => {
        if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src)
      })
      imagesStrip.innerHTML = ''
      currentImages.forEach((img, i) =>
        imagesStrip.appendChild(imageItem(img.url, img.name, 'current', i))
      )
      newImageFiles.forEach((file, i) =>
        imagesStrip.appendChild(imageItem(URL.createObjectURL(file), file.name, 'new', i))
      )
    }

    document.getElementById('addImageBtn').onclick = () =>
      document.getElementById('imageFileInput').click()

    document.getElementById('imageFileInput').addEventListener('change', e => {
      newImageFiles = newImageFiles.concat(Array.from(e.target.files))
      renderImages()
      e.target.value = ''
    })

    function extractImagesFromPaste(e) {
      const items = e.clipboardData && e.clipboardData.items
      if (!items) return []
      const files = []
      for (const item of items) {
        if (item.type && item.type.startsWith('image/')) {
          const file = item.getAsFile()
          if (file) files.push(file)
        }
      }
      return files
    }

    document.addEventListener('paste', e => {
      if (e.target && e.target.id === 'contentInput') {
        const files = extractImagesFromPaste(e)
        if (files.length) {
          e.preventDefault()
          newImageFiles = newImageFiles.concat(files)
          renderImages()
        }
      }
    })

    function showImageOverlay(src) {
      const overlay = document.getElementById('imageOverlay')
      const img = document.getElementById('imageOverlayImg')
      img.src = src
      overlay.style.display = 'flex'
    }

    function hideImageOverlay() {
      document.getElementById('imageOverlay').style.display = 'none'
    }

    document.getElementById('imageOverlay').onclick = hideImageOverlay

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') hideImageOverlay()
    })

    // ===== 日历 =====
    function renderCalendar() {
      calendarDays.innerHTML = ''

      calendarTitle.textContent =
        `${currentYear} · ${String(currentMonth + 1).padStart(2, '0')}`

      const firstDay = new Date(currentYear, currentMonth, 1).getDay()
      const daysInMonth = new Date(
        currentYear,
        currentMonth + 1,
        0
      ).getDate()

      const prevMonthDays = new Date(
        currentYear,
        currentMonth,
        0
      ).getDate()

      for (let i = firstDay - 1; i >= 0; i--) {
        const el = document.createElement('div')
        el.className = 'day other'
        el.textContent = prevMonthDays - i
        calendarDays.appendChild(el)
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const date = `${currentYear}-${String(currentMonth + 1).padStart(
          2,
          '0'
        )}-${String(day).padStart(2, '0')}`

        const el = document.createElement('div')

        el.className = 'day'
        el.textContent = day

        if (entries[date]) {
          el.classList.add('has-entry')
        }

        if (date === selectedDate) {
          el.classList.add('selected')
        }

        el.onclick = () => {
          selectedDate = date
          loadEntry(date)
          renderCalendar()
        }

        calendarDays.appendChild(el)
      }

      renderEntriesList()
    }

    let loadSeq = 0

    async function loadEntry(date) {
      selectedDate = date

      const entry = entries[date]
      const seq = ++loadSeq

      dateInput.value = date

      currentImages = entry && entry.images ? entry.images.slice() : []
      newImageFiles = []
      contentInput.value = ''

      if (entry) {
        timeInput.value = entry.time || ''
        titleInput.value = entry.title || ''
        setSelectedTags(entry.tags)

        document.querySelectorAll('.mood').forEach(btn => {
          btn.classList.toggle(
            'active',
            btn.dataset.mood === entry.mood
          )
        })

        if (entry.id) {
          try {
            const blocks = await getBlocks(entry.id)
            if (seq === loadSeq) {
              const text = blocksToContent(blocks)
              entry.content = text
              contentInput.value = text
            }
          } catch (e) {
            if (seq === loadSeq) contentInput.value = ''
          }
        }
      } else {
        timeInput.value = formatTime(new Date())

        titleInput.value = ''
        setSelectedTags(['日记'])

        document
          .querySelectorAll('.mood')
          .forEach(btn => btn.classList.remove('active'))
      }

      renderImages()
      updateWordCount()
    }

    // ===== 保存（Notion upsert）=====
    async function saveEntry() {
      const date = dateInput.value
      if (!date) return

      const token = notionToken.value.trim()
      const db = notionDb.value.trim()
      if (!token || !db) {
        showTip('请先配置 Notion')
        return
      }

      let uploaded = []
      if (newImageFiles.length) {
        const cfg = getCloudinaryConfig()
        if (!cfg.cloud || !cfg.preset) {
          showTip('请先配置 Cloudinary')
          return
        }
        saveBtn.textContent = '上传中…'
        try {
          uploaded = await Promise.all(newImageFiles.map(uploadToCloudinary))
        } catch (e) {
          showTip('图片上传失败')
          saveBtn.textContent = 'Save'
          return
        }
      }

      const allImages = currentImages.concat(uploaded)
      const mood = document.querySelector('.mood.active')?.dataset.mood || ''
      const title = titleInput.value.trim() || '无题'
      const content = contentInput.value
      const tags = getSelectedTags()

      const startDateTime = timeInput.value ? date + 'T' + timeInput.value + ':00' : date
      const properties = {
        名称: { title: [{ text: { content: title } }] },
        日期: { date: { start: startDateTime } },
        标签: { multi_select: tags.map(t => ({ name: t })) },
        图片: { files: allImages.map(img => ({ name: img.name, external: { url: img.url } })) },
      }
      if (mood) properties['心情'] = { select: { name: mood } }

      saveBtn.textContent = '保存中…'
      try {
        const existing = entries[date]
        let page
        if (existing && existing.id) {
          const res = await fetch(PROXY_BASE + '/pages/' + existing.id, {
            method: 'PATCH',
            headers: getHeaders(),
            body: JSON.stringify({ properties }),
          })
          if (!res.ok) {
            const err = await res.json()
            showTip('保存失败：' + (err.message || res.status))
            saveBtn.textContent = 'Save'
            return
          }
          page = await res.json()
          await replacePageBlocks(existing.id, content)
        } else {
          const body = { parent: { database_id: db }, properties }
          if (content) body.children = contentToBlocks(content)
          const res = await fetch(PROXY_BASE + '/pages', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify(body),
          })
          if (!res.ok) {
            const err = await res.json()
            showTip('保存失败：' + (err.message || res.status))
            saveBtn.textContent = 'Save'
            return
          }
          page = await res.json()
        }

        entries[date] = {
          id: page.id,
          date,
          time: timeInput.value,
          title,
          mood,
          content,
          tags,
          images: allImages,
        }
        currentImages = allImages.slice()
        newImageFiles = []
        renderImages()
        selectedDate = date
        showTip('Saved')
        renderCalendar()
      } catch (e) {
        showTip('网络错误')
      }
      saveBtn.textContent = 'Save'
    }

    // ===== 删除日记 =====
    async function deleteEntry(date) {
      const entry = entries[date]
      if (!entry || !entry.id) return
      const title = entry.title || '无题'
      if (!confirm('确定删除这篇日记吗？\n\n「' + title + '」')) return

      try {
        const res = await fetch(PROXY_BASE + '/pages/' + entry.id, {
          method: 'PATCH',
          headers: getHeaders(),
          body: JSON.stringify({ archived: true }),
        })
        if (!res.ok) {
          showTip('删除失败：' + res.status)
          return
        }
        delete entries[date]
        if (selectedDate === date) {
          loadEntry(date)
        }
        renderCalendar()
        showTip('已删除')
      } catch (e) {
        showTip('删除失败')
      }
    }

    // ===== 条目列表 / 字数 =====
    function renderEntriesList() {
      const keyword = searchInput.value.trim().toLowerCase()

      const list = Object.values(entries)
        .filter(entry => {
          const date = new Date(entry.date)

          const sameMonth =
            date.getFullYear() === currentYear &&
            date.getMonth() === currentMonth

          if (!sameMonth) return false

          if (!keyword) return true

          const text = [
            entry.title,
            entry.content,
            ...(entry.tags || [])
          ]
            .join(' ')
            .toLowerCase()

          return text.includes(keyword)
        })
        .sort((a, b) => b.date.localeCompare(a.date))

      entriesList.innerHTML = ''

      if (!list.length) {
        entriesList.innerHTML =
          '<div class="empty">No entries this month.</div>'
        return
      }

      list.forEach(entry => {
        const item = document.createElement('div')
        item.className = 'entry-item'
        if (entry.date === selectedDate) item.classList.add('active')

        const tags = (entry.tags || [])
          .map(tag => `<span>#${esc(tag)}</span>`)
          .join('')

        item.innerHTML = `
          <button class="entry-delete" title="删除">×</button>
          <div class="entry-date">
            ${entry.date.slice(5).replace('-', '.')}${entry.time ? ' · ' + entry.time : ''}
          </div>

          <div class="entry-name">
            ${esc(entry.title || '无题')}
          </div>

          <div class="entry-tags">
            ${tags}
          </div>
        `

        item.querySelector('.entry-delete').onclick = e => {
          e.stopPropagation()
          deleteEntry(entry.date)
        }

        item.onclick = () => {
          selectedDate = entry.date

          const date = new Date(entry.date + 'T00:00:00')

          currentYear = date.getFullYear()
          currentMonth = date.getMonth()

          loadEntry(entry.date)
          renderCalendar()
        }

        entriesList.appendChild(item)
      })
    }

    function updateWordCount() {
      wordCount.textContent =
        `${contentInput.value.trim().length} 字`
    }

    function showTip(text) {
      const tip = document.getElementById('savedTip')
      tip.textContent = text
      tip.classList.add('show')
      setTimeout(() => {
        tip.classList.remove('show')
      }, 1600)
    }

    // ===== 标签（随笔 / 日记 二选一）=====
    function getSelectedTags() {
      return Array.from(document.querySelectorAll('.tag-option.active')).map(b => b.dataset.tag)
    }

    function setSelectedTags(tags) {
      const set = new Set(tags || [])
      document.querySelectorAll('.tag-option').forEach(b => {
        b.classList.toggle('active', set.has(b.dataset.tag))
      })
    }

    document.querySelectorAll('.tag-option').forEach(btn => {
      btn.onclick = () => {
        btn.classList.toggle('active')
      }
    })

    // ===== 事件绑定 =====
    document.querySelectorAll('.mood').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.mood').forEach(item => {
          item.classList.remove('active')
        })

        btn.classList.add('active')
      }
    })

    document.getElementById('prevMonth').onclick = () => {
      currentMonth--

      if (currentMonth < 0) {
        currentMonth = 11
        currentYear--
      }

      renderCalendar()
    }

    document.getElementById('nextMonth').onclick = () => {
      currentMonth++

      if (currentMonth > 11) {
        currentMonth = 0
        currentYear++
      }

      renderCalendar()
    }

    document.getElementById('saveBtn').onclick = saveEntry

    searchInput.addEventListener('input', renderEntriesList)

    contentInput.addEventListener('input', updateWordCount)

    dateInput.addEventListener('change', () => {
      selectedDate = dateInput.value

      const date = new Date(selectedDate + 'T00:00:00')

      currentYear = date.getFullYear()
      currentMonth = date.getMonth()

      loadEntry(selectedDate)
      renderCalendar()
    })

    // ===== 初始化 =====
    loadConfig()

    dateInput.value = selectedDate
    timeInput.value = formatTime(today)

    ;(async () => {
      if (notionToken.value.trim() && notionDb.value.trim()) {
        try {
          await loadDiaryEntries()
          notionStatus.textContent = '✓ 已连接'
          notionStatus.className = 'config-status ok'
        } catch (e) {
          notionStatus.textContent = '未连接'
        }
      }
      loadEntry(selectedDate)
      renderCalendar()
    })()
  </script>
</body>
</html>
