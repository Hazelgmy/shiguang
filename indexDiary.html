<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拾光 · 日记</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f7f4ee;
      --paper: #fbf9f4;
      --line: #ded8cd;
      --text: #403b35;
      --muted: #9b9387;
      --soft: #c8c0b4;
      --accent: #4d4943;
    }

    /* ===== 滚动条 ===== */

    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--soft);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    ::-webkit-scrollbar-corner {
      background: transparent;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: var(--soft) transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", "Noto Serif SC", serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* ===== 配置栏 ===== */
    .config-bar {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .config-toggle {
      display: none;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      padding: 4px 10px;
    }

    .config-inputs {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .config-field {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .config-field span {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .config-field input {
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      outline: none;
      color: var(--text);
      padding: 6px 2px;
      font-size: 13px;
      width: 150px;
    }

    .config-status {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }

    .config-status.ok {
      color: #7a8f6b;
    }

    .config-status.err {
      color: #b85c5c;
    }

    .config-test {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      padding: 6px 16px;
      font-size: 12px;
      transition: 0.18s ease;
    }

    .config-test:hover {
      background: #eee9e0;
    }

    .view-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .view-tab,
    .event-view-tab {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--text);
      padding: 6px 16px;
      font-size: 12px;
      transition: 0.18s ease;
    }

    .view-tab:hover,
    .event-view-tab:hover,
    .view-tab.active,
    .event-view-tab.active {
      background: #eee9e0;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 330px 1fr;
    }

    /* Sidebar */

    .sidebar {
      min-height: 100vh;
      padding: 34px 30px;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.18);
    }

    .search {
      width: 100%;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: transparent;
      outline: none;
      padding: 10px 2px 12px;
      color: var(--text);
      margin-bottom: 34px;
    }

    .search::placeholder {
      color: #b8b1a7;
    }

    .calendar-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 92px;
      align-items: center;
      gap: 10px;
      margin-bottom: 23px;
    }

    .calendar-title {
      letter-spacing: 4px;
      font-size: 16px;
      min-width: 0;
      white-space: nowrap;
    }

    .calendar-nav {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      width: 92px;
    }

    .calendar-nav button {
      border: 0;
      width: 36px;
      height: 36px;
      background: transparent;
      color: var(--muted);
      padding: 0;
      border-radius: 10px;
      font-size: 20px;
      line-height: 1;
    }

    .calendar-nav button:hover {
      background: rgba(76, 72, 65, 0.07);
      color: var(--text);
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
    }

    .weekdays {
      margin-bottom: 10px;
      font-size: 12px;
      color: #aaa297;
    }

    .days {
      row-gap: 10px;
    }

    .day {
      position: relative;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 14px;
      cursor: pointer;
      transition: 0.18s ease;
    }

    .day:hover {
      background: rgba(76, 72, 65, 0.07);
    }

    .day.other {
      color: #d1cbc1;
    }

    .day.selected {
      background: var(--accent);
      color: white;
    }

    .day.has-entry::after {
      content: "";
      position: absolute;
      bottom: 4px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #9b8063;
    }

    .day.selected::after {
      background: white;
    }

    .month-entries {
      margin-top: 28px;
      border-top: 1px solid var(--line);
      padding-top: 24px;
    }

    .entries-title {
      margin-bottom: 18px;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .entry-item {
      position: relative;
      padding: 10px 10px 13px;
      cursor: pointer;
      border-bottom: 1px solid rgba(222, 216, 205, 0.55);
    }

    .entry-item:hover .entry-name {
      color: #8d6e52;
    }

    .entry-item.active {
      background: rgba(76, 72, 65, 0.06);
      border-radius: 8px;
    }

    .entry-item.active .entry-name {
      color: #8d6e52;
    }

    .entry-delete {
      position: absolute;
      top: 7px;
      right: 6px;
      border: 0;
      background: transparent;
      color: var(--soft);
      font-size: 14px;
      line-height: 1;
      padding: 3px 6px;
      cursor: pointer;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .entry-delete:hover {
      color: #b85c5c;
    }

    .entry-date {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .entry-name {
      font-size: 14px;
      line-height: 1.5;
      transition: 0.15s ease;
    }

    .empty {
      font-style: italic;
      color: #a69e93;
      font-size: 13px;
    }

    .event-day-list {
      display: grid;
      gap: 10px;
    }

    .event-day-item {
      border-bottom: 1px solid rgba(222, 216, 205, 0.55);
      padding: 0 0 10px;
      cursor: pointer;
    }

    .event-day-item-title {
      font-size: 14px;
      line-height: 1.45;
    }

    /* Editor */

    .main {
      min-height: 100vh;
      padding: 70px 9vw 48px;
    }

    .editor {
      max-width: 760px;
      margin: 0 auto;
      min-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
    }

    .meta {
      display: grid;
      grid-template-columns: 112px 64px minmax(640px, 1fr) 112px;
      align-items: center;
      column-gap: 12px;
      color: #7f786e;
      font-size: 13px;
      margin-bottom: 62px;
    }

    .meta input {
      border: 0;
      background: transparent;
      outline: none;
      color: inherit;
      width: 110px;
      flex-shrink: 0;
    }

    .meta input[readonly] {
      cursor: default;
      pointer-events: none;
    }

    .moods {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      min-width: 0;
      overflow: visible;
    }

    .mood {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 0;
      background: transparent;
      color: inherit;
      opacity: 0.42;
      padding: 2px 6px;
      border-radius: 6px;
      transition: 0.16s;
    }

    .mood:hover,
    .mood.active {
      opacity: 1;
      transform: translateY(-2px);
    }

    .mood-emoji {
      font-size: 17px;
      line-height: 1;
    }

    .mood-label {
      font-size: 11px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .save {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 20px;
      width: 112px;
      background: transparent;
      color: #756d63;
      transition: 0.18s ease;
      white-space: nowrap;
    }

    .save:hover {
      background: #eee9e0;
    }

    .title-input {
      width: 100%;
      border: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 24px;
      line-height: 1.25;
      margin-bottom: 36px;
      padding: 0;
    }

    .title-input::placeholder {
      color: #c1b8ab;
    }

    .content {
      width: 100%;
      min-height: 430px;
      flex: 1;
      resize: none;
      border: 0;
      outline: none;
      background: transparent;
      color: #4d4740;
      font-size: 18px;
      line-height: 2;
      padding: 0;
    }

    .content::placeholder {
      color: #bdb5a9;
    }

    .event-fields {
      margin: -14px 0 24px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 12px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .event-toggle {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 14px;
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .event-extra {
      display: none;
      flex: 1;
      min-width: 0;
      grid-template-columns: minmax(0, 1fr) 150px;
      gap: 12px;
    }

    .event-extra.show {
      display: grid;
    }

    .event-extra input,
    .event-extra select,
    .quick-event-form input,
    .quick-event-form select,
    .quick-event-form textarea {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.22);
      color: var(--text);
      outline: none;
      padding: 10px 12px;
    }

    /* ===== 图片 ===== */
    .images {
      margin: 20px 0 24px;
    }

    .images-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .images-strip:empty {
      display: none;
    }

    .image-item {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.3);
    }

    .image-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }

    .image-remove {
      position: absolute;
      top: 2px;
      right: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 0;
      background: rgba(64, 59, 53, 0.72);
      color: #fff;
      font-size: 11px;
      line-height: 18px;
      padding: 0;
    }

    .image-new {
      position: absolute;
      top: 2px;
      left: 2px;
      background: #9b8063;
      color: #fff;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      pointer-events: none;
    }

    .add-image {
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.5px;
      padding: 0;
      transition: color 0.15s;
    }

    .add-image:hover {
      color: var(--text);
    }

    /* ===== 附件 ===== */
    .atts-strip {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 12px 0 10px;
    }

    .atts-strip:empty {
      display: none;
    }

    .att-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text);
      max-width: 460px;
    }

    .att-row .att-name {
      flex: 1;
      color: #8d6e52;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .att-row .att-name:hover {
      text-decoration: underline;
    }

    .att-row .att-name-static {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .att-remove {
      border: 0;
      background: transparent;
      color: var(--soft);
      font-size: 14px;
      line-height: 1;
      padding: 2px 6px;
      cursor: pointer;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .att-remove:hover {
      color: #b85c5c;
    }

    .att-new-badge {
      background: #9b8063;
      color: #fff;
      font-size: 9px;
      padding: 1px 4px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .image-overlay {
      position: fixed;
      inset: 0;
      background: rgba(36, 28, 18, 0.82);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
      padding: 24px;
    }

    .image-overlay-img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .footer {
      border-top: 1px solid var(--line);
      padding-top: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .tag-options {
      display: flex;
      gap: 8px;
      flex: 1;
    }

    .tag-option {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 14px;
      transition: 0.15s ease;
    }

    .tag-option:hover {
      background: #eee9e0;
      color: var(--text);
    }

    .tag-option.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .word-count {
      white-space: nowrap;
      font-size: 12px;
    }

    .event-workspace {
      max-width: 940px;
      margin: 0 auto;
      height: 100%;
      overflow: auto;
      padding-right: 4px;
    }

    .event-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .event-title {
      font-size: 24px;
      letter-spacing: 2px;
      font-weight: 400;
    }

    .event-view-tabs {
      display: flex;
      gap: 8px;
    }

    .timeline-year {
      margin: 22px 0 10px;
      font-size: 24px;
      font-weight: 400;
      color: var(--accent);
    }

    .timeline-month {
      margin: 12px 0 6px;
      color: var(--muted);
      letter-spacing: 2px;
      font-size: 15px;
    }

    .timeline-item {
      border-left: 1px solid var(--line);
      padding: 0 0 14px 16px;
      cursor: pointer;
    }

    .timeline-date {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 2px;
    }

    .timeline-name {
      font-size: 16px;
      line-height: 1.35;
    }

    .timeline-summary {
      margin-top: 8px;
      color: #6f675e;
      line-height: 1.7;
      font-size: 14px;
    }

    .event-calendar-head,
    .event-day-panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 16px;
    }

    .event-calendar-title {
      font-size: 24px;
      letter-spacing: 2px;
    }

    .event-calendar-grid,
    .event-calendar-weekdays {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .event-calendar-weekdays {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      margin-bottom: 8px;
    }

    .event-calendar-day {
      min-height: 82px;
      border: 1px solid rgba(222, 216, 205, 0.75);
      padding: 8px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.12);
    }

    .event-calendar-day.other {
      color: #c8c0b4;
      background: transparent;
    }

    .event-calendar-day.selected {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .event-dot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      margin-top: 8px;
      border-radius: 999px;
      background: #eee9e0;
      font-size: 11px;
    }

    .event-calendar-items {
      display: grid;
      gap: 4px;
      margin-top: 8px;
    }

    .event-calendar-item {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #6f675e;
      font-size: 12px;
      line-height: 1.35;
    }

    .event-day-panel {
      margin-top: 24px;
      border-top: 1px solid var(--line);
      padding-top: 22px;
    }

    .quick-event-form {
      display: none;
      gap: 10px;
      margin-top: 16px;
    }

    .quick-event-form.show {
      display: grid;
    }

    .quick-event-form textarea {
      min-height: 90px;
      resize: vertical;
    }

    .quick-event-images {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .quick-event-images .images-strip { margin: 0; }

    .event-detail-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: rgba(46, 42, 36, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .event-detail-modal {
      width: min(720px, 100%);
      max-height: 86vh;
      overflow: auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 80px rgba(64, 59, 53, 0.18);
    }

    .event-detail-images {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .event-detail-images img {
      width: 120px;
      height: 120px;
      padding: 4px;
      object-fit: cover;
      border: 1px solid var(--ui-line);
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 8px 20px rgba(64, 121, 211, 0.12);
      cursor: pointer;
    }

    .event-detail-modal .timeline-summary {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .saved-tip {
      position: fixed;
      right: 30px;
      bottom: 28px;
      padding: 9px 17px;
      border-radius: 999px;
      background: rgba(69, 64, 57, 0.9);
      color: white;
      font-size: 12px;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: 0.2s ease;
    }

    .saved-tip.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 850px) {
      .config-toggle {
        display: block;
      }

      .config-inputs {
        display: none;
        width: 100%;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
      }

      .config-inputs.open {
        display: flex;
      }

      .config-field input {
        flex: 1;
        width: auto;
      }

      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        min-height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
        padding: 24px 20px;
      }

      .main {
        padding: 24px 18px 48px;
      }

      .meta {
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 24px;
      }

      .moods {
        grid-column: 1 / -1;
        flex-wrap: wrap;
        gap: 6px;
        overflow: visible;
      }

      .mood {
        padding: 5px 8px;
      }

      .save {
        width: 100%;
      }

      .title-input {
        font-size: 24px;
        margin-bottom: 20px;
      }

      .content {
        font-size: 16px;
      }

      .event-fields {
        align-items: stretch;
        flex-direction: column;
      }

      .event-extra.show {
        grid-template-columns: 1fr;
      }

      .search {
        font-size: 16px;
      }

      .calendar-nav button {
        padding: 6px 8px;
        font-size: 20px;
      }
    }

    @media (min-width: 851px) {
      body {
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }

      .config-bar {
        flex-shrink: 0;
      }

      .app {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      .sidebar {
        min-height: 0;
        overflow-y: auto;
      }

      .main {
        min-height: 0;
        overflow: hidden;
        padding: 24px 3vw 24px;
      }

      .editor {
        max-width: 900px;
        height: 100%;

      box-shadow: none;
      backdrop-filter: none;
    }

    html[data-theme="paper"] .search,
    html[data-theme="paper"] .config-field,
    html[data-theme="paper"] .event-extra input,
    html[data-theme="paper"] .event-extra select,
    html[data-theme="paper"] .quick-event-form input,
    html[data-theme="paper"] .quick-event-form select,
    html[data-theme="paper"] .quick-event-form textarea,
    html[data-theme="paper"] .tag-option,
    html[data-theme="paper"] .event-day-item {
      background: transparent;
    }

    html[data-theme="paper"] .event-detail-modal { background: #fbf9f4; }

    html[data-theme="paper"] .config-test,
    html[data-theme="paper"] .view-tab,
    html[data-theme="paper"] .event-view-tab,
    html[data-theme="paper"] .config-toggle {
      background: transparent;
      box-shadow: none;
    }

    html[data-theme="paper"] .tag-option.active {
      background: #4d4943;
      border-color: #4d4943;
      color: #fff;
    }

    html[data-theme="paper"] .title-input,
    html[data-theme="paper"] .content { color: #585149; }

    html[data-theme="paper"] .view-tab.active,
    html[data-theme="paper"] .event-view-tab.active {
      background: #eee9e0;
      border-color: var(--ui-line);
      color: var(--ui-text);
      box-shadow: none;
    }

    html[data-theme="paper"] .save {
      background: transparent;
      border-color: var(--ui-line);
      color: #756d63;
      box-shadow: none;
    }

    html[data-theme="paper"] .day.selected {
      background: #4d4943;
      box-shadow: none;
    }

    html[data-theme="paper"] .event-calendar-weekdays {
      background: transparent;
      border-color: #ded8cd;
      color: #9b9387;
    }

    html[data-theme="paper"] .event-calendar-grid {
      border-color: #ded8cd;
    }

    html[data-theme="paper"] .event-calendar-day {
      background: transparent;
      border-color: #ded8cd;
      color: #403b35;
    }

    html[data-theme="paper"] .event-calendar-day:hover {
      background: rgba(76, 72, 65, 0.05);
    }

    html[data-theme="paper"] .event-calendar-day.other {
      background: transparent;
      color: #c8c0b4;
    }

    html[data-theme="paper"] .event-calendar-day.selected {
      outline-color: #4d4943;
      background: transparent;
    }

    html[data-theme="paper"] .event-calendar-item,
    html[data-theme="paper"] .event-dot {
      background: transparent;
      color: #6f675e;
    }

    html[data-theme="paper"] .mood:hover,
    html[data-theme="paper"] .mood.active,
    html[data-theme="paper"] .entry-item:hover,
    html[data-theme="paper"] .entry-item.active,
    html[data-theme="paper"] .timeline-item:hover {
      background: var(--ui-primary-soft);
      border-color: var(--ui-line);
    }
  </style>
</head>

<body>
  <!-- 配置栏 -->
  <div class="config-bar">
    <button class="config-toggle" id="configToggle" title="配置">⚙</button>
    <div class="config-inputs" id="configInputs">
      <label class="config-field">
        <span>Notion Token</span>
        <input type="password" id="notion-token" placeholder="secret_…" />
      </label>
      <label class="config-field">
        <span>Database ID</span>
        <input type="text" id="diary-notion-db" placeholder="Diary 数据库 ID" />
      </label>
      <label class="config-field">
        <span>Cloud Name</span>
        <input type="text" id="cloudinary-cloud" placeholder="Cloud Name" />
      </label>
      <label class="config-field">
        <span>Preset</span>
        <input type="text" id="cloudinary-preset" placeholder="Preset" />
      </label>
    </div>
    <span class="config-status" id="notion-status">未连接</span>
    <button class="config-test" id="testNotionBtn">测试连接</button>
    <div class="view-tabs">
      <button class="view-tab active" id="diaryModeBtn" type="button">日记</button>
      <button class="view-tab" id="eventModeBtn" type="button">⭐ 大事记</button>
    </div>
    <button class="config-test theme-toggle" type="button" onclick="toggleTheme()" title="切换米白主题">◐</button>
    <button class="config-test" onclick="location.href='./index.html'">← 拾光</button>
  </div>

  <div class="app">

    <aside class="sidebar">
      <input
        id="search"
        class="search"
        placeholder="⌕  Search memories..."
      />

      <div class="calendar-header">
        <div id="calendarTitle" class="calendar-title"></div>

        <div class="calendar-nav">
          <button id="prevMonth">‹</button>
          <button id="nextMonth">›</button>
        </div>
      </div>

      <div class="weekdays">
        <div>S</div>
        <div>M</div>
        <div>T</div>
        <div>W</div>
        <div>T</div>
        <div>F</div>
        <div>S</div>
      </div>

      <div id="calendarDays" class="days"></div>

      <div class="month-entries">
        <div class="entries-title">This month</div>
        <div id="entriesList"></div>
      </div>
    </aside>

    <main class="main">
      <div class="editor">

        <div class="meta">
          <input id="dateInput" type="date" readonly />
          <input id="timeInput" type="time" readonly />

          <div class="moods">
            <button class="mood" data-mood="开心"><span class="mood-emoji">😄</span><span class="mood-label">开心</span></button>
            <button class="mood" data-mood="思考"><span class="mood-emoji">🤔</span><span class="mood-label">思考</span></button>
            <button class="mood" data-mood="兴奋"><span class="mood-emoji">🤩</span><span class="mood-label">兴奋</span></button>
            <button class="mood" data-mood="焦虑"><span class="mood-emoji">😟</span><span class="mood-label">焦虑</span></button>
            <button class="mood" data-mood="低落"><span class="mood-emoji">😔</span><span class="mood-label">低落</span></button>
            <button class="mood" data-mood="生气"><span class="mood-emoji">😡</span><span class="mood-label">生气</span></button>
            <button class="mood" data-mood="成长"><span class="mood-emoji">🌱</span><span class="mood-label">成长</span></button>
            <button class="mood" data-mood="灵感"><span class="mood-emoji">💡</span><span class="mood-label">灵感</span></button>
          </div>

          <button id="saveBtn" class="save">Save</button>
        </div>

        <input
          id="titleInput"
          class="title-input"
          placeholder="给今天取个名字……"
        />

        <textarea
          id="contentInput"
          class="content"
          placeholder="今天发生了什么，心里在想什么……"
        ></textarea>

        <div class="event-fields">
          <label class="event-toggle">
            <input id="eventToggle" type="checkbox" />
            <span>⭐ 记为人生事件</span>
          </label>
          <div class="event-extra" id="eventExtra">
            <input id="eventTitleInput" type="text" placeholder="人生事件标题（可空）" />
            <select id="eventTypeInput">
              <option value="学习">学习</option>
              <option value="工作">工作</option>
              <option value="生活">生活</option>
              <option value="考试">考试</option>
              <option value="健康">健康</option>
              <option value="旅行">旅行</option>
              <option value="纪念">纪念</option>
              <option value="其他">其他</option>
            </select>
          </div>
        </div>

        <div class="editor-tools">
          <div class="images">
            <div class="images-strip" id="imagesStrip"></div>
            <button class="add-image" id="addImageBtn">＋ 图片</button>
            <input type="file" id="imageFileInput" accept="image/*" multiple hidden />

            <div class="atts-strip" id="attsStrip"></div>
            <button class="add-image" id="addAttBtn">＋ 文件</button>
            <input type="file" id="attFileInput" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.md,.csv,.zip" multiple hidden />
          </div>

          <div class="footer">
            <span>Tags:</span>

            <div class="tag-options">
              <button class="tag-option" data-tag="日记">日记</button>
              <button class="tag-option" data-tag="随笔">随笔</button>
            </div>

            <span id="wordCount" class="word-count">0 字</span>
          </div>
        </div>

      </div>

      <div class="event-workspace" id="eventWorkspace" style="display: none">
        <div class="event-toolbar">
          <div class="event-title">历程</div>
          <div class="event-view-tabs">
            <button class="event-view-tab active" id="timelineViewBtn" type="button">时间轴</button>
            <button class="event-view-tab" id="calendarViewBtn" type="button">日历</button>
          </div>
        </div>

        <section id="eventTimelineView"></section>

        <section id="eventCalendarView" style="display: none">
          <div class="event-calendar-head">
            <button class="event-view-tab" id="eventPrevMonth" type="button">←</button>
            <div class="event-calendar-title" id="eventCalendarTitle"></div>
            <button class="event-view-tab" id="eventNextMonth" type="button">→</button>
          </div>
          <div class="event-calendar-weekdays">
            <div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>
          </div>
          <div class="event-calendar-grid" id="eventCalendarGrid"></div>
          <div class="event-day-panel" id="eventDayPanel"></div>
        </section>
      </div>
    </main>

    <aside class="insights-panel" id="insightsPanel" aria-label="日记统计"></aside>

  </div>

  <div id="savedTip" class="saved-tip">Saved</div>

  <div id="imageOverlay" class="image-overlay" style="display: none">
    <img id="imageOverlayImg" class="image-overlay-img" src="" alt="" />
  </div>

  <div id="eventDetailOverlay" class="event-detail-overlay" style="display: none" onclick="hideEventDetail(event)">
    <div class="event-detail-modal" onclick="event.stopPropagation()">
      <div id="eventDetailBody"></div>
    </div>
  </div>

  <script>
    const THEME_STORAGE_KEY = 'shiguang_theme'

    function setTheme(theme) {
      const next = theme === 'paper' ? 'paper' : 'blue'
      document.documentElement.dataset.theme = next
      document.querySelectorAll('.theme-toggle').forEach(button => {
        button.textContent = next === 'paper' ? '☀' : '◐'
        button.title = next === 'paper' ? '切换蓝白主题' : '切换米白主题'
      })
    }

    function toggleTheme() {
      const next = document.documentElement.dataset.theme === 'paper' ? 'blue' : 'paper'
      localStorage.setItem(THEME_STORAGE_KEY, next)
      setTheme(next)
    }

    setTheme(localStorage.getItem(THEME_STORAGE_KEY) || 'blue')

    // ===== Notion / Cloudinary 配置 =====
    const notionToken = document.getElementById('notion-token')
    const notionDb = document.getElementById('diary-notion-db')
    const cloudinaryCloud = document.getElementById('cloudinary-cloud')
    const cloudinaryPreset = document.getElementById('cloudinary-preset')
    const notionStatus = document.getElementById('notion-status')

    const PROXY_BASE = 'https://shiguang-proxy.hazel3248627535.workers.dev/v1'

    function loadConfig() {
      notionToken.value = localStorage.getItem('notion_token') || ''
      notionDb.value = localStorage.getItem('diary_notion_db') || ''
      cloudinaryCloud.value = localStorage.getItem('cloudinary_cloud') || ''
      cloudinaryPreset.value = localStorage.getItem('cloudinary_preset') || ''
    }

    function saveConfig() {
      localStorage.setItem('notion_token', notionToken.value.trim())
      localStorage.setItem('diary_notion_db', notionDb.value.trim())
      localStorage.setItem('cloudinary_cloud', cloudinaryCloud.value.trim())
      localStorage.setItem('cloudinary_preset', cloudinaryPreset.value.trim())
    }

    ;[notionToken, notionDb, cloudinaryCloud, cloudinaryPreset].forEach(el =>
      el.addEventListener('input', saveConfig)
    )

    document.getElementById('configToggle').onclick = () => {
      document.getElementById('configInputs').classList.toggle('open')
    }

    function getHeaders() {
      return {
        Authorization: 'Bearer ' + notionToken.value.trim(),
        'Notion-Version': '2022-06-28',
        'Content-Type': 'application/json',
      }
    }

    function getCloudinaryConfig() {
      return {
        cloud: cloudinaryCloud.value.trim(),
        preset: cloudinaryPreset.value.trim(),
      }
    }

    // ===== 数据 =====
    let entries = {}
    let allEntries = []
    let eventEntries = []
    let currentImages = []
    let newImageFiles = []
    let quickEventImageFiles = []

    // 附件状态
    // 5 MiB = 免费版 Notion 工作区的单文件上传硬限制（官方 max_file_upload_size_in_bytes = 5242880），
    // 超过会被 Notion 拒绝。注意：20 MiB 只是 API single_part / multi_part 的分界线，
    // 并不代表免费版能传 20MB。付费版上限为 5 GiB。
    const MAX_ATT_SIZE = 5 * 1024 * 1024 // 单文件最大 5MiB
    const MAX_ATT_SIZE_MB = MAX_ATT_SIZE / 1024 / 1024
    let currentAtts = [] // 已有附件
    let newAttFiles = [] // 本次新增附件

    const today = new Date()

    let currentYear = today.getFullYear()
    let currentMonth = today.getMonth()
    let selectedDate = formatDate(today)
    let appMode = 'diary'
    let eventView = 'timeline'
    let selectedEventDate = selectedDate

    const dateInput = document.getElementById('dateInput')
    const timeInput = document.getElementById('timeInput')
    const titleInput = document.getElementById('titleInput')
    const contentInput = document.getElementById('contentInput')
    const wordCount = document.getElementById('wordCount')
    const calendarDays = document.getElementById('calendarDays')
    const calendarTitle = document.getElementById('calendarTitle')
    const entriesList = document.getElementById('entriesList')
    const searchInput = document.getElementById('search')
    const saveBtn = document.getElementById('saveBtn')
    const imagesStrip = document.getElementById('imagesStrip')
    const attsStrip = document.getElementById('attsStrip')
    const eventToggle = document.getElementById('eventToggle')
    const eventExtra = document.getElementById('eventExtra')
    const eventTitleInput = document.getElementById('eventTitleInput')
    const eventTypeInput = document.getElementById('eventTypeInput')
    const eventWorkspace = document.getElementById('eventWorkspace')
    const eventTimelineView = document.getElementById('eventTimelineView')
    const eventCalendarView = document.getElementById('eventCalendarView')
    const eventCalendarGrid = document.getElementById('eventCalendarGrid')
    const eventCalendarTitle = document.getElementById('eventCalendarTitle')
    const eventDayPanel = document.getElementById('eventDayPanel')
    const insightsPanel = document.getElementById('insightsPanel')

    function formatDate(date) {
      const y = date.getFullYear()
      const m = String(date.getMonth() + 1).padStart(2, '0')
      const d = String(date.getDate()).padStart(2, '0')
      return `${y}-${m}-${d}`
    }

    function formatTime(date) {
      return `${String(date.getHours()).padStart(2, '0')}:${String(
        date.getMinutes()
      ).padStart(2, '0')}`
    }

    const MOOD_EMOJI = {
      开心: '😄',
      思考: '🤔',
      兴奋: '🤩',
      焦虑: '😟',
      低落: '😔',
      生气: '😡',
      成长: '🌱',
      灵感: '💡',
    }

    function esc(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
    }

    const INSIGHT_WORD_CACHE_KEY = 'shiguang_insight_word_cache'
    let insightHydrationRun = 0
    let insightWordCache = (() => {
      try { return JSON.parse(localStorage.getItem(INSIGHT_WORD_CACHE_KEY) || '{}') }
      catch (e) { return {} }
    })()

    function insightEntries() {
      return allEntries.filter(entry => entry && entry.date)
    }

    function insightEntryTitle(entry) {
      return (entry && (entry.title || entry.eventTitle)) || '无题'
    }

    function calculateStreak(list) {
      const dates = new Set(list.map(entry => entry.date))
      const cursor = new Date(today.getFullYear(), today.getMonth(), today.getDate())
      if (!dates.has(formatDate(cursor))) cursor.setDate(cursor.getDate() - 1)
      let count = 0
      while (dates.has(formatDate(cursor))) {
        count++
        cursor.setDate(cursor.getDate() - 1)
      }
      return count
    }

    function openInsightEntry(id) {
      const entry = allEntries.find(item => item.id === id)
      if (!entry) return
      setAppMode('diary')
      selectedDate = entry.date
      const date = new Date(entry.date + 'T00:00:00')
      currentYear = date.getFullYear()
      currentMonth = date.getMonth()
      loadEntry(entry.date)
      renderCalendar()
      scrollToEditor()
    }

    function openRandomInsight() {
      const list = insightEntries()
      if (!list.length) return
      openInsightEntry(list[Math.floor(Math.random() * list.length)].id)
    }

    function renderInsights() {
      if (!insightsPanel) return
      const list = insightEntries()
      if (!list.length) {
        insightsPanel.innerHTML = '<section class="insight-card"><div class="insight-title">📊 日记概览</div><div class="insight-empty">写下第一篇日记后，这里会出现你的记录轨迹。</div></section>'
        return
      }

      const thisMonth = list.filter(entry => {
        const date = new Date(entry.date + 'T00:00:00')
        return date.getFullYear() === today.getFullYear() && date.getMonth() === today.getMonth()
      })
      const dayCount = new Set(list.map(entry => entry.date)).size
      const totalWords = list.reduce((sum, entry) => {
        const count = entry.content != null
          ? String(entry.content).trim().length
          : Number(entry.contentLength || 0)
        return sum + count
      }, 0)
      const streak = calculateStreak(list)

      const moodPalette = {
        开心: '#f2c75c', 思考: '#6f98e9', 兴奋: '#f29b86', 焦虑: '#d99ad8',
        低落: '#9bb2c9', 生气: '#e67572', 成长: '#83b98a', 灵感: '#e9b85e'
      }
      const moodCounts = {}
      list.forEach(entry => {
        if (entry.mood) moodCounts[entry.mood] = (moodCounts[entry.mood] || 0) + 1
      })
      const moods = Object.entries(moodCounts).sort((a, b) => b[1] - a[1])
      const moodTotal = moods.reduce((sum, item) => sum + item[1], 0)
      let moodOffset = 0
      const moodGradient = moods.map(([mood, count]) => {
        const start = moodOffset
        moodOffset += count / moodTotal * 100
        return `${moodPalette[mood] || '#a8b7d3'} ${start}% ${moodOffset}%`
      }).join(', ')

      const tagCounts = {}
      list.forEach(entry => (entry.tags || []).forEach(tag => {
        tagCounts[tag] = (tagCounts[tag] || 0) + 1
      }))
      const tags = Object.entries(tagCounts).sort((a, b) => b[1] - a[1]).slice(0, 8)

      const todayKey = formatDate(today).slice(5)
      const anniversary = list
        .filter(entry => entry.date.slice(5) === todayKey && entry.date.slice(0, 4) < String(today.getFullYear()))
        .sort((a, b) => b.date.localeCompare(a.date))[0]

      const photos = list
        .slice()
        .sort((a, b) => b.date.localeCompare(a.date))
        .flatMap(entry => (entry.images || []).map(image => ({ ...image, entry })))
        .slice(0, 8)

      insightsPanel.innerHTML = `
        <section class="insight-card">
          <div class="insight-stats">
            <div class="insight-stat"><div class="insight-stat-label">本月日记</div><div class="insight-stat-value">${thisMonth.length}</div></div>
            <div class="insight-stat"><div class="insight-stat-label">总字数</div><div class="insight-stat-value">${new Intl.NumberFormat('zh-CN').format(totalWords)}</div></div>
            <div class="insight-stat"><div class="insight-stat-label">记录天数</div><div class="insight-stat-value">${dayCount}</div></div>
          </div>
        </section>
        <section class="insight-card">
          <div class="insight-title">🔥 连续记录天数</div>
          <div class="streak-value">${streak} 天</div>
          <div class="streak-note">${streak ? '继续保持，留下今天的光。' : '今天写一篇，就从此刻开始。'}</div>
        </section>
        <section class="insight-card">
          <div class="insight-title">🌸 情绪分布</div>
          ${moodTotal ? `<div class="mood-insight">
            <div class="mood-donut" style="background:conic-gradient(${moodGradient})"><div class="mood-donut-center"><strong>${moodTotal}</strong>总数</div></div>
            <div class="mood-list">${moods.slice(0, 5).map(([mood, count]) => `<div class="mood-row"><span>${MOOD_EMOJI[mood] || '•'} ${esc(mood)}</span><span>${count}</span><span>${Math.round(count / moodTotal * 100)}%</span></div>`).join('')}</div>
          </div>` : '<div class="insight-empty">还没有情绪记录。</div>'}
        </section>
        <section class="insight-card">
          <div class="insight-title">🏷️ 标签统计</div>
          ${tags.length ? `<div class="tag-cloud">${tags.map(([tag, count]) => `<span class="tag-chip">${esc(tag)} · ${count}</span>`).join('')}</div>` : '<div class="insight-empty">还没有标签。</div>'}
        </section>
        <section class="insight-card">
          <div class="insight-title">🗓️ 往年今日</div>
          ${anniversary ? `<button class="insight-link" onclick="openInsightEntry('${anniversary.id}')"><div class="insight-link-date">${anniversary.date} · ${today.getFullYear() - Number(anniversary.date.slice(0, 4))} 年前</div><div class="insight-link-title">${esc(insightEntryTitle(anniversary))}　›</div></button>` : '<div class="insight-empty">今天还没有往年记录。</div>'}
        </section>
        <section class="insight-card">
          <button class="insight-link" onclick="openRandomInsight()">
            <div class="insight-title">🎲 随机回忆</div>
            <div class="insight-link-title">从 ${list.length} 篇记录里，重新遇见一束光　›</div>
          </button>
        </section>
        <section class="insight-card">
          <div class="recent-photo-head"><div class="insight-title">🖼️ 最近日记照片</div></div>
          ${photos.length ? `<div class="recent-photos">${photos.map(photo => `<button class="recent-photo" onclick="showImageOverlay('${esc(photo.url)}')" title="${esc(insightEntryTitle(photo.entry))}"><img src="${esc(photo.url)}" alt="${esc(photo.name || insightEntryTitle(photo.entry))}" /></button>`).join('')}</div>` : '<div class="insight-empty">最近还没有照片。</div>'}
        </section>
      `
    }

    async function hydrateInsightContents() {
      const run = ++insightHydrationRun
      const missing = insightEntries().filter(entry => {
        if (!entry.id || entry.content != null) return false
        const cached = insightWordCache[entry.id]
        if (cached && cached.edited === entry.lastEditedTime) {
          entry.contentLength = cached.count
          return false
        }
        return true
      })
      renderInsights()
      for (let i = 0; i < missing.length; i += 3) {
        const batch = missing.slice(i, i + 3)
        await Promise.all(batch.map(async entry => {
          try {
            entry.content = blocksToContent(await getBlocks(entry.id))
          } catch (e) {
            entry.content = ''
          }
          entry.contentLength = String(entry.content || '').trim().length
          insightWordCache[entry.id] = { edited: entry.lastEditedTime || '', count: entry.contentLength }
        }))
        if (run !== insightHydrationRun) return
        localStorage.setItem(INSIGHT_WORD_CACHE_KEY, JSON.stringify(insightWordCache))
        if (i % 12 === 0 || i + 3 >= missing.length) renderInsights()
      }
    }

    // ===== Notion 查询 / 解析 =====
    async function queryNotion(dbId, cursor) {
      const body = {
        page_size: 100,
        sorts: [{ timestamp: 'created_time', direction: 'descending' }],
      }
      if (cursor) body.start_cursor = cursor
      const res = await fetch(PROXY_BASE + '/databases/' + dbId + '/query', {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify(body),
      })
      if (!res.ok) throw new Error('query failed ' + res.status)
      return res.json()
    }

    async function fetchAllPages(dbId) {
      let results = []
      let cursor
      do {
        const data = await queryNotion(dbId, cursor)
        results = results.concat(data.results || [])
        cursor = data.has_more ? data.next_cursor : undefined
      } while (cursor)
      return results
    }

    function textOf(props, key) {
      const p = props[key]
      if (!p) return ''
      if (p.rich_text) return p.rich_text.map(r => r.plain_text).join('')
      if (p.title) return p.title.map(r => r.plain_text).join('')
      if (p.select) return (p.select && p.select.name) || ''
      if (p.multi_select) return p.multi_select.map(s => s.name).join(', ')
      return ''
    }

    function checkboxOf(props, key) {
      const p = props[key]
      return !!(p && p.checkbox)
    }

    function parseNotionPage(page) {
      const props = page.properties || {}

      let date = ''
      let time = ''
      const dProp = props['日期']
      if (dProp) {
        if (dProp.date && dProp.date.start) {
          const start = dProp.date.start
          date = start.slice(0, 10)
          if (start.length >= 16) time = start.slice(11, 16)
        } else {
          date = textOf(props, '日期')
        }
      }

      let images = []
      const imgProp = props['图片']
      if (imgProp && Array.isArray(imgProp.files)) {
        images = imgProp.files
          .map(f => ({
            url: (f.external && f.external.url) || (f.file && f.file.url) || '',
            name: f.name || '',
          }))
          .filter(i => i.url)
      }

      // 附件：kind 标记来源，external = 外部链接，file = Notion 托管文件
      let attachments = []
      const attProp = props['附件']
      if (attProp && Array.isArray(attProp.files)) {
        attachments = attProp.files
          .map(f => {
            if (f.external && f.external.url) return { url: f.external.url, name: f.name || '', kind: 'external' }
            if (f.file && f.file.url) return { url: f.file.url, name: f.name || '', kind: 'file' }
            return null
          })
          .filter(Boolean)
      }

      return {
        id: page.id,
        createdTime: page.created_time || '',
        lastEditedTime: page.last_edited_time || '',
        date,
        time,
        title: textOf(props, '名称'),
        mood: textOf(props, '心情'),
        tags: textOf(props, '标签').split(',').map(t => t.trim()).filter(Boolean),
        isEvent: checkboxOf(props, '是否大事记') || checkboxOf(props, 'Is Event'),
        eventTitle: textOf(props, '大事记标题') || textOf(props, 'Event Title'),
        eventType: textOf(props, '事件类型') || textOf(props, 'Event Type') || '学习',
        images,
        attachments,
      }
    }

    function isEventPage(entry) {
      return !!(entry && entry.isEvent && entry.date)
    }

    function eventDisplayTitle(entry) {
      return (entry && (entry.eventTitle || entry.title)) || '无题事件'
    }

    function eventTypeIcon(type) {
      const icons = {
        学习: '📚',
        工作: '💻',
        生活: '🌿',
        考试: '📝',
        健康: '💪',
        旅行: '✈️',
        纪念: '⭐',
        其他: '✨',
      }
      return icons[type] || icons['其他']
    }

    function tagsText(tags) {
      return (tags || []).map(tag => '#' + tag).join(' · ')
    }

    function eventDateTimeValue(entry) {
      return (entry.date || '') + 'T' + (entry.time || '00:00')
    }

    function buildEventIndexes() {
      eventEntries = allEntries
        .filter(isEventPage)
        .sort((a, b) => eventDateTimeValue(b).localeCompare(eventDateTimeValue(a)))
    }

    function getEventsForDate(date) {
      return eventEntries
        .filter(entry => entry.date === date)
        .sort((a, b) => (a.time || '').localeCompare(b.time || ''))
    }

    function upsertLocalEntry(entry) {
      allEntries = allEntries.filter(item => item.id !== entry.id).concat(entry)
      if (!entries[entry.date] || !entry.isEvent || entries[entry.date].id === entry.id) {
        entries[entry.date] = entry
      }
      buildEventIndexes()
      renderInsights()
    }

    // ===== 正文存为页面 blocks =====
    function contentToBlocks(content) {
      if (!content) return []
      return content.split('\n').map(line => {
        const rich_text = []
        if (line) {
          for (let i = 0; i < line.length; i += 2000) {
            rich_text.push({ type: 'text', text: { content: line.slice(i, i + 2000) } })
          }
        }
        return { object: 'block', type: 'paragraph', paragraph: { rich_text } }
      })
    }

    function blocksToContent(blocks) {
      return (blocks || [])
        .filter(b => b.type === 'paragraph')
        .map(b => (b.paragraph.rich_text || []).map(r => r.plain_text).join(''))
        .join('\n')
    }

    async function getBlocks(pageId) {
      let results = []
      let cursor
      do {
        let url = PROXY_BASE + '/blocks/' + pageId + '/children?page_size=100'
        if (cursor) url += '&start_cursor=' + encodeURIComponent(cursor)
        const res = await fetch(url, { headers: getHeaders() })
        if (!res.ok) throw new Error('get blocks failed ' + res.status)
        const data = await res.json()
        results = results.concat(data.results || [])
        cursor = data.has_more ? data.next_cursor : undefined
      } while (cursor)
      return results
    }

    async function appendBlocks(pageId, children) {
      const res = await fetch(PROXY_BASE + '/blocks/' + pageId + '/children', {
        method: 'PATCH',
        headers: getHeaders(),
        body: JSON.stringify({ children }),
      })
      if (!res.ok) throw new Error('append blocks failed ' + res.status)
    }

    async function deleteBlock(blockId) {
      const res = await fetch(PROXY_BASE + '/blocks/' + blockId, {
        method: 'DELETE',
        headers: getHeaders(),
      })
      if (!res.ok) throw new Error('delete block failed ' + res.status)
    }

    async function replacePageBlocks(pageId, content) {
      let existing = []
      try {
        existing = await getBlocks(pageId)
      } catch (e) {
        // 读不到旧块则忽略，继续追加
      }
      if (existing.length) {
        await Promise.all(existing.map(b => deleteBlock(b.id)))
      }
      const blocks = contentToBlocks(content)
      if (blocks.length) {
        await appendBlocks(pageId, blocks)
      }
    }

    async function loadDiaryEntries() {
      const db = notionDb.value.trim()
      if (!db) return
      const pages = await fetchAllPages(db)
      const next = {}
      const parsed = []
      pages.forEach(page => {
        const e = parseNotionPage(page)
        if (!e.date) return
        parsed.push(e)
        if (!next[e.date] || (!e.isEvent && next[e.date].isEvent)) next[e.date] = e
      })
      allEntries = parsed
      entries = next
      buildEventIndexes()
      renderInsights()
      hydrateInsightContents()
    }

    // ===== 图片 =====
    async function uploadToCloudinary(file) {
      const cfg = getCloudinaryConfig()
      const fd = new FormData()
      fd.append('file', file)
      fd.append('upload_preset', cfg.preset)
      const res = await fetch(

    // ===== 附件（Notion File Upload API，经 Worker 代理）=====
    function attIcon(name) {
      const ext = (String(name || '').split('.').pop() || '').toLowerCase()
      const map = {
        pdf: '📄', doc: '📝', docx: '📝',
        xls: '📊', xlsx: '📊', csv: '📊',
        ppt: '📽️', pptx: '📽️',
        txt: '📃', md: '📑', zip: '🗜️',
      }
      return map[ext] || '📎'
    }

    function attExt(name) {
      const s = String(name || '')
      const i = s.lastIndexOf('.')
      return i >= 0 ? s.slice(i + 1).toLowerCase() : ''
    }

    // 纯文本文件白名单：只有这些后缀会在上传前被读取/补 UTF-8 BOM。
    // 其余（PDF/Word/Excel/PPT/ZIP/图片等）一律视为二进制，完全不处理。
    const TEXT_ATT_EXTS = ['md', 'markdown', 'txt', 'text', 'csv', 'tsv', 'log']

    function isTextAtt(file) {
      return TEXT_ATT_EXTS.indexOf(attExt(file.name)) >= 0
    }

    // 纯文本文件的 MIME 强制带 charset=utf-8，帮助 Notion 按 UTF-8 解码预览
    const TEXT_ATT_MIME = {
      md: 'text/markdown; charset=utf-8',
      markdown: 'text/markdown; charset=utf-8',
      txt: 'text/plain; charset=utf-8',
      text: 'text/plain; charset=utf-8',
      csv: 'text/csv; charset=utf-8',
      tsv: 'text/tab-separated-values; charset=utf-8',
      log: 'text/plain; charset=utf-8',
    }

    function attContentType(file) {
      const ext = attExt(file.name)
      // 纯文本：忽略浏览器给的 file.type，统一带 charset=utf-8
      if (TEXT_ATT_MIME[ext]) return TEXT_ATT_MIME[ext]
      if (file.type) return file.type
      const map = {
        pdf: 'application/pdf',
        doc: 'application/msword',
        docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
        xls: 'application/vnd.ms-excel',
        xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
        ppt: 'application/vnd.ms-powerpoint',
        pptx: 'application/vnd.openxmlformats-officedocument.presentationml.presentation',
        zip: 'application/zip',
      }
      return map[ext] || 'application/octet-stream'
    }

    // 纯文本文件上传前确保带 UTF-8 BOM（EF BB BF）
    // · 非文本文件（PDF/Word/Excel/PPT/ZIP/图片…）→ 原样返回，不读不写不处理
    // · 已有 BOM → 不补字节，仅把 MIME 归一成带 charset=utf-8 的形式
    // · 没有 BOM → 只在最前面补 3 个字节
    // 文件名始终保持不变
    async function withUtf8Bom(file) {
      if (!isTextAtt(file)) return file
      const bytes = new Uint8Array(await file.arrayBuffer())
      const hasBom = bytes.length >= 3 && bytes[0] === 0xef && bytes[1] === 0xbb && bytes[2] === 0xbf
      const type = attContentType(file)
      const out = hasBom
        ? new File([bytes], file.name, { type })
        : new File([new Uint8Array([0xef, 0xbb, 0xbf]), bytes], file.name, { type })
      console.log('[附件] ' + file.name + ' 文本文件 · ' + (hasBom ? '已有 BOM（原样）' : '已补 UTF-8 BOM') + ' · content_type=' + type)
      return out
    }

    // Notion File Upload API 版本（只用于附件上传这两个请求，
    // 避免升级后影响现有 databases/pages/blocks 的调用行为）
    const NOTION_UPLOAD_VERSION = '2026-03-11'

    // 附件上传专用请求头
    // withJson = true  → 第一步 create：带 Content-Type: application/json
    // withJson = false → 第二步 send：绝对不带 Content-Type，由浏览器生成 multipart boundary
    function getUploadHeaders(withJson) {
      const headers = {
        Authorization: 'Bearer ' + notionToken.value.trim(),
        'Notion-Version': NOTION_UPLOAD_VERSION,
      }
      if (withJson) headers['Content-Type'] = 'application/json'
      return headers
    }

    // 读取 Notion 错误信息（含 code，方便定位 invalid_json 之类的问题）
    async function notionErrorMessage(res) {
      let msg = 'HTTP ' + res.status
      try {
        const err = await res.json()
        if (err && err.message) msg = err.message + (err.code ? '（' + err.code + '）' : '')
      } catch (e) {}
      return msg
    }

    // 把保存失败的 Notion 报错翻译成可操作的提示
    function saveErrorTip(err, res) {
      const msg = (err && err.message) || String(res && res.status)
      // 日记库还没建「附件」字段时最常见：validation_error + "附件 is not a property that exists."
      if (err && err.code === 'validation_error' && msg.indexOf('附件') >= 0) {
        alert(
          '日记数据库里还没有「附件」字段，所以带附件的保存会被拒绝。\n\n' +
            '请在 Notion 的日记数据库中新增一个属性：\n' +
            '· 名称：附件（三个字，必须一模一样）\n' +
            '· 类型：Files & media\n\n' +
            '建好后再点一次保存即可，已选好的文件不会丢。'
        )
        return '缺少「附件」字段'
      }
      return '保存失败：' + msg
    }

    // 上传单个附件：创建 file upload → 发送文件内容 → 返回 {id, name}
    async function uploadAttToNotion(rawFile) {
      // 纯文本文件（.md/.txt/.csv 等）先补 UTF-8 BOM 再上传；二进制文件原样透传
      const file = await withUtf8Bom(rawFile)

      // ===== 第 1 步：创建 File Upload（必须是 JSON，不能是 FormData）=====
      const createRes = await fetch(PROXY_BASE + '/file_uploads', {
        method: 'POST',
        headers: getUploadHeaders(true),
        body: JSON.stringify({
          mode: 'single_part',
          filename: file.name,
          content_type: attContentType(file),
        }),
      })
      if (!createRes.ok) {
        throw new Error('「' + file.name + '」第 1 步创建上传失败（/v1/file_uploads）：' + (await notionErrorMessage(createRes)))
      }
      const fu = await createRes.json()
      if (!fu || !fu.id) {
        throw new Error('「' + file.name + '」第 1 步创建上传失败：响应里没有 file_upload id')
      }

      // ===== 第 2 步：发送文件内容（multipart/form-data，手动设置 Content-Type 会破坏 boundary）=====
      const formData = new FormData()
      formData.append('file', file, file.name)
      const sendRes = await fetch(PROXY_BASE + '/file_uploads/' + fu.id + '/send', {
        method: 'POST',
        headers: getUploadHeaders(false),
        body: formData,
      })
      if (!sendRes.ok) {
        const msg = await notionErrorMessage(sendRes)
        const hint =
          msg.indexOf('invalid_json') >= 0
            ? '（提示：说明 Worker 把 /file_uploads/{id}/send 的 Content-Type 改写成了 application/json，需在 Worker 里原样透传 multipart）'
            : ''
        throw new Error('「' + file.name + '」第 2 步发送文件失败（/v1/file_uploads/{id}/send）：' + msg + hint)
      }

      return { id: fu.id, name: file.name }
    }

    // 从保存/创建页面响应中解析「附件」属性（拿到 Notion 生成的真实下载 URL）
    function parseAttProp(prop) {
      if (!prop || !Array.isArray(prop.files)) return []
      return prop.files
        .map(f => {
          if (f.external && f.external.url) return { url: f.external.url, name: f.name || '', kind: 'external' }
          if (f.file && f.file.url) return { url: f.file.url, name: f.name || '', kind: 'file' }
          return null
        })
        .filter(Boolean)
    }

    function attRow(att, kind) {
      const row = document.createElement('div')
      row.className = 'att-row'

      const icon = document.createElement('span')
      icon.textContent = attIcon(att.name)

      const name = document.createElement(kind === 'current' ? 'a' : 'span')
      if (kind === 'current') {
        name.className = 'att-name'
        name.href = att.url
        name.target = '_blank'
        name.rel = 'noopener'
        name.title = '打开/下载文件'
      } else {
        name.className = 'att-name-static'
      }
      name.textContent = att.name
      name.title = att.name

      row.appendChild(icon)
      row.appendChild(name)

      if (kind === 'new') {
        const badge = document.createElement('span')
        badge.className = 'att-new-badge'
        badge.textContent = '新'
        row.appendChild(badge)
      }

      const del = document.createElement('button')
      del.className = 'att-remove'
      del.textContent = '×'
      del.title = '移除'
      del.onclick = e => {
        e.stopPropagation()
        if (kind === 'current') currentAtts.splice(Number(row.dataset.index), 1)
        else newAttFiles.splice(Number(row.dataset.index), 1)
        renderAtts()
      }
      row.appendChild(del)

      return row
    }

    function renderAtts() {
      attsStrip.innerHTML = ''
      currentAtts.forEach((a, i) => {
        const row = attRow(a, 'current')
        row.dataset.index = i
        attsStrip.appendChild(row)
      })
      newAttFiles.forEach((f, i) => {
        const row = attRow({ name: f.name }, 'new')
        row.dataset.index = i
        attsStrip.appendChild(row)
      })
    }

    document.getElementById('addAttBtn').onclick = () =>
      document.getElementById('attFileInput').click()

    document.getElementById('attFileInput').addEventListener('change', e => {
      const files = Array.from(e.target.files)
      const tooBig = files.filter(f => f.size > MAX_ATT_SIZE)
      if (tooBig.length) {
        alert('以下文件超过 ' + MAX_ATT_SIZE_MB + 'MB，已跳过：\n' + tooBig.map(f => '• ' + f.name).join('\n'))
      }
      newAttFiles = newAttFiles.concat(files.filter(f => f.size <= MAX_ATT_SIZE))
      renderAtts()
      e.target.value = ''
    })

    function imageItem(src, name, kind, index) {
      const div = document.createElement('div')
      div.className = 'image-item'
      const img = document.createElement('img')
      img.src = src
      img.alt = name || ''
      img.onclick = e => {
        e.stopPropagation()
        showImageOverlay(src)
      }
      const del = document.createElement('button')
      del.className = 'image-remove'
      del.textContent = '×'
      del.title = '移除'
      del.onclick = e => {
        e.stopPropagation()
        if (kind === 'current') currentImages.splice(index, 1)
        else newImageFiles.splice(index, 1)
        renderImages()
      }
      div.appendChild(img)
      div.appendChild(del)
      if (kind === 'new') {
        const badge = document.createElement('span')
        badge.className = 'image-new'
        badge.textContent = '新'
        div.appendChild(badge)
      }
      return div
    }

    function renderImages() {
      imagesStrip.querySelectorAll('img').forEach(img => {
        if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src)
      })
      imagesStrip.innerHTML = ''
      currentImages.forEach((img, i) =>
        imagesStrip.appendChild(imageItem(img.url, img.name, 'current', i))
      )
      newImageFiles.forEach((file, i) =>
        imagesStrip.appendChild(imageItem(URL.createObjectURL(file), file.name, 'new', i))
      )
    }

    document.getElementById('addImageBtn').onclick = () =>
      document.getElementById('imageFileInput').click()

    document.getElementById('imageFileInput').addEventListener('change', e => {
      newImageFiles = newImageFiles.concat(Array.from(e.target.files))
      renderImages()
      e.target.value = ''
    })

    function extractImagesFromPaste(e) {
      const items = e.clipboardData && e.clipboardData.items
      if (!items) return []
      const files = []
      for (const item of items) {
        if (item.type && item.type.startsWith('image/')) {
          const file = item.getAsFile()
          if (file) files.push(file)
        }
      }
      return files
    }

    document.addEventListener('paste', e => {
      if (e.target && e.target.id === 'contentInput') {
        const files = extractImagesFromPaste(e)
        if (files.length) {
          e.preventDefault()
          newImageFiles = newImageFiles.concat(files)
          renderImages()
        }
      }
    })
