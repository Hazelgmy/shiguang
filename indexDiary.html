      eventCalendarView.style.display = view === 'calendar' ? 'block' : 'none'
      renderEventViews()
    }

    function renderEventViews() {
      if (appMode !== 'events') return
      if (eventView === 'timeline') renderEventTimeline()
      else renderEventCalendar()
    }

    function renderEventTimeline() {
      if (!eventEntries.length) {
        eventTimelineView.innerHTML = '<div class="empty">No events yet.</div>'
        return
      }

      let html = ''
      let currentYearLabel = ''
      let currentMonthLabel = ''

      eventEntries.forEach(entry => {
        const year = entry.date.slice(0, 4)
        const month = entry.date.slice(5, 7)
        const ym = year + '-' + month
        if (year !== currentYearLabel) {
          currentYearLabel = year
          html += `<h2 class="timeline-year">${year}</h2>`
          currentMonthLabel = ''
        }
        if (ym !== currentMonthLabel) {
          currentMonthLabel = ym
          html += `<div class="timeline-month">${month}月</div>`
        }
        const tags = tagsText(entry.tags)
        const meta = `${entry.date.slice(5).replace('-', '.')}${entry.time ? ' · ' + entry.time : ''}${tags ? ' · ' + esc(tags) : ''}`
        const main = eventDisplayTitle(entry)
        html += `
          <div class="timeline-item" onclick="showEventDetail('${entry.id}')">
            <div class="timeline-date">${meta}</div>
            <div class="timeline-name">${eventTypeIcon(entry.eventType)} ${esc(main)}</div>
          </div>`
      })
      eventTimelineView.innerHTML = html
    }

    function renderEventCalendar() {
      eventCalendarTitle.textContent = `${currentYear} 年 ${String(currentMonth + 1).padStart(2, '0')} 月`
      eventCalendarGrid.innerHTML = ''

      const firstDay = new Date(currentYear, currentMonth, 1).getDay()
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate()
      const prevMonthDays = new Date(currentYear, currentMonth, 0).getDate()

      for (let i = firstDay - 1; i >= 0; i--) {
        const el = document.createElement('div')
        el.className = 'event-calendar-day other'
        el.textContent = prevMonthDays - i
        eventCalendarGrid.appendChild(el)
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const date = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`
        const dayEvents = getEventsForDate(date)
        const el = document.createElement('div')
        el.className = 'event-calendar-day'
        if (date === selectedEventDate) el.classList.add('selected')
        const previewEvents = dayEvents.slice(0, 2)
        const eventItems = previewEvents.length
          ? `<div class="event-calendar-items">${previewEvents.map(entry => `
              <div class="event-calendar-item" title="${esc(eventDisplayTitle(entry))}">
                ${eventTypeIcon(entry.eventType)} ${esc(eventDisplayTitle(entry))}
              </div>`).join('')}${dayEvents.length > 2 ? `<div class="event-calendar-item">+${dayEvents.length - 2}</div>` : ''}</div>`
          : ''
        el.innerHTML = `<div>${day}</div>${eventItems}`
        el.onclick = () => {
          selectedEventDate = date
          renderEventCalendar()
        }
        eventCalendarGrid.appendChild(el)
      }

      renderEventDayPanel(selectedEventDate)
    }

    function renderEventDayPanel(date) {
      const dayEvents = getEventsForDate(date)
      const title = `${Number(date.slice(5, 7))}月${Number(date.slice(8, 10))}日`
      const listHTML = dayEvents.length
        ? `<div class="event-day-list">${dayEvents.map(entry => `
            <div class="event-day-item" onclick="showEventDetail('${entry.id}')">
              <div class="entry-date">${entry.date.slice(5).replace('-', '.')}${entry.time ? ' · ' + entry.time : ''}${tagsText(entry.tags) ? ' · ' + esc(tagsText(entry.tags)) : ''}</div>
              <div class="event-day-item-title">${esc(eventDisplayTitle(entry))}</div>
            </div>`).join('')}</div>`
        : '<div class="empty">这天还没有事件。</div>'

      eventDayPanel.innerHTML = `
        <div class="event-day-panel-head">
          <div>${title}</div>
          <button class="event-view-tab" type="button" onclick="openAddEventForm('${date}')">＋ 添加事件</button>
        </div>
        ${listHTML}
        <div class="quick-event-form" id="quickEventForm">
          <input id="quickEventDate" type="date" value="${date}" />
          <input id="quickEventTitle" type="text" placeholder="事件标题" />
          <select id="quickEventType">
            <option value="学习">学习</option>
            <option value="工作">工作</option>
            <option value="生活">生活</option>
            <option value="考试">考试</option>
            <option value="健康">健康</option>
            <option value="旅行">旅行</option>
            <option value="纪念">纪念</option>
            <option value="其他">其他</option>
          </select>
          <textarea id="quickEventContent" placeholder="备注/正文（可选）"></textarea>
          <div class="quick-event-images">
            <div class="images-strip" id="quickEventImagesStrip"></div>
            <button class="add-image" type="button" onclick="document.getElementById('quickEventImageInput').click()">＋ 图片</button>
            <input id="quickEventImageInput" type="file" accept="image/*" multiple hidden onchange="handleQuickEventImages(event)" />
          </div>
          <button class="event-view-tab" id="quickEventSaveBtn" type="button" onclick="saveEventFromCalendar()">保存事件</button>
        </div>`
    }

    function openAddEventForm(date) {
      selectedEventDate = date
      quickEventImageFiles = []
      const form = document.getElementById('quickEventForm')
      if (form) {
        form.classList.add('show')
        renderQuickEventImages()
        const title = document.getElementById('quickEventTitle')
        if (title) title.focus()
      }
    }

    function handleQuickEventImages(event) {
      quickEventImageFiles = quickEventImageFiles.concat(Array.from(event.target.files || []))
      event.target.value = ''
      renderQuickEventImages()
    }

    function renderQuickEventImages() {
      const strip = document.getElementById('quickEventImagesStrip')
      if (!strip) return
      strip.querySelectorAll('img').forEach(img => {
        if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src)
      })
      strip.innerHTML = ''
      quickEventImageFiles.forEach((file, index) => {
        const item = document.createElement('div')
        item.className = 'image-item'
        const img = document.createElement('img')
        img.src = URL.createObjectURL(file)
        img.alt = file.name
        img.onclick = e => {
          e.stopPropagation()
          showImageOverlay(img.src)
        }
        const remove = document.createElement('button')
        remove.className = 'image-remove'
        remove.type = 'button'
        remove.textContent = '×'
        remove.onclick = e => {
          e.stopPropagation()
          quickEventImageFiles.splice(index, 1)
          renderQuickEventImages()
        }
        item.appendChild(img)
        item.appendChild(remove)
        strip.appendChild(item)
      })
    }

    async function saveEventFromCalendar() {
      const token = notionToken.value.trim()
      const db = notionDb.value.trim()
      if (!token || !db) {
        showTip('请先配置 Notion')
        return
      }

      const date = document.getElementById('quickEventDate').value || selectedEventDate
      const eventTitle = document.getElementById('quickEventTitle').value.trim()
      const eventType = document.getElementById('quickEventType').value || '学习'
      const content = document.getElementById('quickEventContent').value
      const title = eventTitle || '未命名事件'
      const quickSaveBtn = document.getElementById('quickEventSaveBtn')
      let uploadedImages = []

      if (quickEventImageFiles.length) {
        const cfg = getCloudinaryConfig()
        if (!cfg.cloud || !cfg.preset) {
          showTip('请先配置 Cloudinary')
          return
        }
        quickSaveBtn.disabled = true
        quickSaveBtn.textContent = '上传中…'
        try {
          uploadedImages = await Promise.all(quickEventImageFiles.map(uploadToCloudinary))
        } catch (e) {
          quickSaveBtn.disabled = false
          quickSaveBtn.textContent = '保存事件'
          showTip('图片上传失败')
          return
        }
      }

      const properties = {
        名称: { title: [{ text: { content: title } }] },
        日期: { date: { start: date } },
        标签: { multi_select: [{ name: '日记' }] },
        图片: { files: uploadedImages.map(img => ({ name: img.name, external: { url: img.url } })) },
        是否大事记: { checkbox: true },
        大事记标题: { rich_text: eventTitle ? [{ text: { content: eventTitle } }] : [] },
        事件类型: { select: { name: eventType } },
      }

      try {
        const body = { parent: { database_id: db }, properties }
        if (content) body.children = contentToBlocks(content)
        const res = await fetch(PROXY_BASE + '/pages', {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify(body),
        })
        if (!res.ok) {
          const err = await res.json()
          quickSaveBtn.disabled = false
          quickSaveBtn.textContent = '保存事件'
          showTip(saveErrorTip(err, res))
          return
        }
        const page = await res.json()
        upsertLocalEntry({
          id: page.id,
          createdTime: page.created_time || '',
          date,
          time: '',
          title,
          mood: '',
          content,
          tags: ['日记'],
          isEvent: true,
          eventTitle,
          eventType,
          images: uploadedImages,
          attachments: [],
        })
        quickEventImageFiles = []
        selectedEventDate = date
        showTip('Saved')
        renderCalendar()
        renderEventCalendar()
        renderEventTimeline()
      } catch (e) {
        quickSaveBtn.disabled = false
        quickSaveBtn.textContent = '保存事件'
        showTip('网络错误')
      }
    }

    async function showEventDetail(eventId) {
      const entry = eventEntries.find(item => item.id === eventId) || allEntries.find(item => item.id === eventId)
      if (!entry) return
      let content = entry.content || ''
      if (entry.id && !content) {
        try {
          const blocks = await getBlocks(entry.id)
          content = blocksToContent(blocks)
          entry.content = content
        } catch (e) {}
      }
      const images = entry.images && entry.images.length
        ? `<div class="event-detail-images">${entry.images.map(img => `<img src="${esc(img.url)}" alt="${esc(img.name || '')}" onclick="event.stopPropagation();showImageOverlay('${esc(img.url)}')" />`).join('')}</div>`
        : ''
      document.getElementById('eventDetailBody').innerHTML = `
        <div class="timeline-date">${entry.date}${entry.time ? ' · ' + entry.time : ''}${tagsText(entry.tags) ? ' · ' + esc(tagsText(entry.tags)) : ''}</div>
        <h2 class="timeline-name">${esc(eventDisplayTitle(entry))}</h2>
        <div class="timeline-summary">${esc(content || '')}</div>
        ${images}
      `
      document.getElementById('eventDetailOverlay').style.display = 'flex'
    }

    function hideEventDetail(e) {
      if (e && e.target !== document.getElementById('eventDetailOverlay')) return
      document.getElementById('eventDetailOverlay').style.display = 'none'
    }

    // ===== 日历 =====
    function renderCalendar() {
      calendarDays.innerHTML = ''

      calendarTitle.textContent =
        `${currentYear} · ${String(currentMonth + 1).padStart(2, '0')}`

      const firstDay = new Date(currentYear, currentMonth, 1).getDay()
      const daysInMonth = new Date(
        currentYear,
        currentMonth + 1,
        0
      ).getDate()

      const prevMonthDays = new Date(
        currentYear,
        currentMonth,
        0
      ).getDate()

      for (let i = firstDay - 1; i >= 0; i--) {
        const el = document.createElement('div')
        el.className = 'day other'
        el.textContent = prevMonthDays - i
        calendarDays.appendChild(el)
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const date = `${currentYear}-${String(currentMonth + 1).padStart(
          2,
          '0'
        )}-${String(day).padStart(2, '0')}`

        const el = document.createElement('div')

        el.className = 'day'
        el.textContent = day

        if (appMode === 'events' ? getEventsForDate(date).length : entries[date]) {
          el.classList.add('has-entry')
        }

        if (date === (appMode === 'events' ? selectedEventDate : selectedDate)) {
          el.classList.add('selected')
        }

        el.onclick = () => {
          if (appMode === 'events') {
            selectedEventDate = date
            setEventView('calendar')
          } else {
            selectedDate = date
            loadEntry(date)
          }
          renderCalendar()
          scrollToEditor()
        }

        calendarDays.appendChild(el)
      }

      if (appMode === 'events') renderEventSidebarList()
      else renderEntriesList()
    }

    let loadSeq = 0

    async function loadEntry(date) {
      selectedDate = date

      const entry = entries[date]
      const seq = ++loadSeq

      dateInput.value = date

      currentImages = entry && entry.images ? entry.images.slice() : []
      newImageFiles = []
      currentAtts = entry && entry.attachments ? entry.attachments.slice() : []
      newAttFiles = []
      contentInput.value = ''

      if (entry) {
        timeInput.value = entry.time || ''
        titleInput.value = entry.title || ''
        setSelectedTags(entry.tags)

        document.querySelectorAll('.mood').forEach(btn => {
          btn.classList.toggle(
            'active',
            btn.dataset.mood === entry.mood
          )
        })

        if (entry.id) {
          try {
            const blocks = await getBlocks(entry.id)
            if (seq === loadSeq) {
              const text = blocksToContent(blocks)
              entry.content = text
              contentInput.value = text
            }
          } catch (e) {
            if (seq === loadSeq) contentInput.value = ''
          }
        }
      } else {
        timeInput.value = formatTime(new Date())

        titleInput.value = ''
        setSelectedTags(['日记'])

        document
          .querySelectorAll('.mood')
          .forEach(btn => btn.classList.remove('active'))
      }

      eventToggle.checked = !!(entry && entry.isEvent)
      eventTitleInput.value = entry && entry.eventTitle ? entry.eventTitle : ''
      eventTypeInput.value = entry && entry.eventType ? entry.eventType : '学习'
      renderEventFields()
      renderImages()
      renderAtts()
      updateWordCount()
      renderInsights()
    }

    // ===== 保存（Notion upsert）=====
    async function saveEntry() {
      const date = dateInput.value
      if (!date) return

      const token = notionToken.value.trim()
      const db = notionDb.value.trim()
      if (!token || !db) {
        showTip('请先配置 Notion')
        return
      }

      let uploaded = []
      if (newImageFiles.length) {
        const cfg = getCloudinaryConfig()
        if (!cfg.cloud || !cfg.preset) {
          showTip('请先配置 Cloudinary')
          return
        }
        saveBtn.textContent = '上传中…'
        try {
          uploaded = await Promise.all(newImageFiles.map(uploadToCloudinary))
        } catch (e) {
          showTip('图片上传失败')
          saveBtn.textContent = 'Save'
          return
        }
      }

      const allImages = currentImages.concat(uploaded)

      // 上传新增附件（Notion File Upload API）
      let uploadedAtts = []
      if (newAttFiles.length) {
        saveBtn.textContent = '上传文件中…'
        try {
          for (const f of newAttFiles) {
            uploadedAtts.push(await uploadAttToNotion(f))
          }
        } catch (e) {
          showTip('文件上传失败：' + e.message)
          saveBtn.textContent = 'Save'
          return
        }
      }
      // kind: upload = 本次刚上传（还没有 URL），保存后从响应里解析真实 URL
      const allAtts = currentAtts.concat(uploadedAtts.map(u => ({ name: u.name, id: u.id, kind: 'upload' })))

      const mood = document.querySelector('.mood.active')?.dataset.mood || ''
      const title = titleInput.value.trim() || '无题'
      const content = contentInput.value
      const tags = getSelectedTags()
      const isEvent = eventToggle.checked
      const eventTitle = eventTitleInput.value.trim()
      const eventType = eventTypeInput.value || '学习'

      const startDateTime = timeInput.value ? date + 'T' + timeInput.value + ':00' : date
      const properties = {
        名称: { title: [{ text: { content: title } }] },
        日期: { date: { start: startDateTime } },
        标签: { multi_select: tags.map(t => ({ name: t })) },
        图片: { files: allImages.map(img => ({ name: img.name, external: { url: img.url } })) },
        是否大事记: { checkbox: isEvent },
        大事记标题: { rich_text: eventTitle ? [{ text: { content: eventTitle } }] : [] },
        事件类型: { select: isEvent ? { name: eventType } : null },
      }
      if (mood) properties['心情'] = { select: { name: mood } }
      // 只在有附件时写入「附件」，避免数据库还没有该字段时保存报错
      if (allAtts.length) {
        properties['附件'] = {
          files: allAtts.map(a =>
            a.kind === 'external'
              ? { name: a.name, external: { url: a.url } }
              : a.kind === 'file'
                ? { name: a.name, type: 'file', file: { url: a.url } }
                : { name: a.name, type: 'file_upload', file_upload: { id: a.id } }
          ),
        }
      }

      saveBtn.textContent = '保存中…'
      try {
        const existing = entries[date]
        let page
        if (existing && existing.id) {
          const res = await fetch(PROXY_BASE + '/pages/' + existing.id, {
            method: 'PATCH',
            headers: getHeaders(),
            body: JSON.stringify({ properties }),
          })
          if (!res.ok) {
            const err = await res.json()
            showTip(saveErrorTip(err, res))
            saveBtn.textContent = 'Save'
            return
          }
          page = await res.json()
          await replacePageBlocks(existing.id, content)
        } else {
          const body = { parent: { database_id: db }, properties }
          if (content) body.children = contentToBlocks(content)
          const res = await fetch(PROXY_BASE + '/pages', {
            method: 'POST',
            headers: getHeaders(),
            body: JSON.stringify(body),
          })
          if (!res.ok) {
            const err = await res.json()
            showTip(saveErrorTip(err, res))
            saveBtn.textContent = 'Save'
            return
          }
          page = await res.json()
        }

        const savedAtts = parseAttProp(page.properties && page.properties['附件'])
        const savedEntry = {
          id: page.id,
          createdTime: page.created_time || '',
          lastEditedTime: page.last_edited_time || '',
          date,
          time: timeInput.value,
          title,
          mood,
          content,
          tags,
          isEvent,
          eventTitle,
          eventType,
          images: allImages,
          attachments: savedAtts,
        }
        upsertLocalEntry(savedEntry)
        currentImages = allImages.slice()
        newImageFiles = []
        currentAtts = savedAtts.slice()
        newAttFiles = []
        renderImages()
        renderAtts()
        selectedDate = date
        showTip('Saved')
        renderCalendar()
        renderEventViews()
      } catch (e) {
        showTip('网络错误')
      }
      saveBtn.textContent = 'Save'
    }

    // ===== 删除日记 =====
    async function deleteEntry(date) {
      const entry = entries[date]
      if (!entry || !entry.id) return
      const title = entry.title || '无题'
      if (!confirm('确定删除这篇日记吗？\n\n「' + title + '」')) return

      try {
        const res = await fetch(PROXY_BASE + '/pages/' + entry.id, {
          method: 'PATCH',
          headers: getHeaders(),
          body: JSON.stringify({ archived: true }),
        })
        if (!res.ok) {
          showTip('删除失败：' + res.status)
          return
        }
        delete entries[date]
        allEntries = allEntries.filter(item => item.id !== entry.id)
        buildEventIndexes()
        renderInsights()
        if (selectedDate === date) {
          loadEntry(date)
        }
        renderCalendar()
        renderEventViews()
        showTip('已删除')
      } catch (e) {
        showTip('删除失败')
      }
    }

    // ===== 条目列表 / 字数 =====
    function renderEventSidebarList() {
      const keyword = searchInput.value.trim().toLowerCase()
      const list = eventEntries
        .filter(entry => {
          const date = new Date(entry.date + 'T00:00:00')
          const sameMonth =
            date.getFullYear() === currentYear &&
            date.getMonth() === currentMonth
          if (!sameMonth) return false
          if (!keyword) return true
          return [
            eventDisplayTitle(entry),
            entry.title,
            entry.content,
            entry.eventType,
            ...(entry.tags || [])
          ].join(' ').toLowerCase().includes(keyword)
        })

      entriesList.innerHTML = ''

      if (!list.length) {
        entriesList.innerHTML = '<div class="empty">No events this month.</div>'
        return
      }

      const wrap = document.createElement('div')
      wrap.className = 'event-day-list'
      list.forEach(entry => {
        const item = document.createElement('div')
        item.className = 'event-day-item'
        const tags = tagsText(entry.tags)
        item.innerHTML = `
          <div class="entry-date">${entry.date.slice(5).replace('-', '.')}${entry.time ? ' · ' + entry.time : ''}${tags ? ' · ' + esc(tags) : ''}</div>
          <div class="event-day-item-title">${esc(eventDisplayTitle(entry))}</div>
        `
        item.onclick = () => {
          selectedEventDate = entry.date
          setEventView('calendar')
          showEventDetail(entry.id)
          renderCalendar()
        }
        wrap.appendChild(item)
      })
      entriesList.appendChild(wrap)
    }

    function renderEntriesList() {
      const keyword = searchInput.value.trim().toLowerCase()

      const list = Object.values(entries)
        .filter(entry => {
          const date = new Date(entry.date)

          const sameMonth =
            date.getFullYear() === currentYear &&
            date.getMonth() === currentMonth

          if (!sameMonth) return false

          if (!keyword) return true

          const text = [
            entry.title,
            entry.content,
            entry.mood,
            entry.mood ? MOOD_EMOJI[entry.mood] : '',
            ...(entry.tags || [])
          ]
            .join(' ')
            .toLowerCase()

          return text.includes(keyword)
        })
        .sort((a, b) => b.date.localeCompare(a.date))

      entriesList.innerHTML = ''

      if (!list.length) {
        entriesList.innerHTML =
          '<div class="empty">No entries this month.</div>'
        return
      }

      list.forEach(entry => {
        const item = document.createElement('div')
        item.className = 'entry-item'
        if (entry.date === selectedDate) item.classList.add('active')

        const tags = (entry.tags || [])
          .map(tag => `#${esc(tag)}`)
          .join(' · ')

        const moodText = entry.mood
          ? ` · ${MOOD_EMOJI[entry.mood] || ''} ${entry.mood}`
          : ''

        item.innerHTML = `
          <button class="entry-delete" title="删除">×</button>
          <div class="entry-date">
            ${entry.date.slice(5).replace('-', '.')}${entry.time ? ' · ' + entry.time : ''}${moodText}${tags ? ' · ' + tags : ''}
          </div>

          <div class="entry-name">
            ${esc(entry.title || '无题')}
          </div>
        `

        item.querySelector('.entry-delete').onclick = e => {
          e.stopPropagation()
          deleteEntry(entry.date)
        }

        item.onclick = () => {
          selectedDate = entry.date

          const date = new Date(entry.date + 'T00:00:00')

          currentYear = date.getFullYear()
          currentMonth = date.getMonth()

          loadEntry(entry.date)
          renderCalendar()
          scrollToEditor()
        }

        entriesList.appendChild(item)
      })
    }

    function updateWordCount() {
      wordCount.textContent =
        `${contentInput.value.trim().length} 字`
    }

    function showTip(text) {
      const tip = document.getElementById('savedTip')
      tip.textContent = text
      tip.classList.add('show')
      setTimeout(() => {
        tip.classList.remove('show')
      }, 1600)
    }

    function scrollToEditor() {
      if (!window.matchMedia('(max-width: 850px)').matches) return
      const main = document.querySelector('.main')
      if (main) main.scrollIntoView({ behavior: 'smooth', block: 'start' })
    }

    // ===== 标签（随笔 / 日记 二选一）=====
    function getSelectedTags() {
      return Array.from(document.querySelectorAll('.tag-option.active')).map(b => b.dataset.tag)
    }

    function setSelectedTags(tags) {
      const set = new Set(tags || [])
      document.querySelectorAll('.tag-option').forEach(b => {
        b.classList.toggle('active', set.has(b.dataset.tag))
      })
    }

    document.querySelectorAll('.tag-option').forEach(btn => {
      btn.onclick = () => {
        btn.classList.toggle('active')
      }
    })

    // ===== 事件绑定 =====
    document.querySelectorAll('.mood').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.mood').forEach(item => {
          item.classList.remove('active')
        })

        btn.classList.add('active')
      }
    })

    eventToggle.addEventListener('change', renderEventFields)
    document.getElementById('diaryModeBtn').onclick = () => setAppMode('diary')
    document.getElementById('eventModeBtn').onclick = () => setAppMode('events')
    document.getElementById('timelineViewBtn').onclick = () => setEventView('timeline')
    document.getElementById('calendarViewBtn').onclick = () => setEventView('calendar')

    document.getElementById('prevMonth').onclick = () => {
      currentMonth--

      if (currentMonth < 0) {
        currentMonth = 11
        currentYear--
      }

      renderCalendar()
      renderEventViews()
    }

    document.getElementById('nextMonth').onclick = () => {
      currentMonth++

      if (currentMonth > 11) {
        currentMonth = 0
        currentYear++
      }

      renderCalendar()
      renderEventViews()
    }

    document.getElementById('eventPrevMonth').onclick = () => {
      currentMonth--
      if (currentMonth < 0) {
        currentMonth = 11
        currentYear--
      }
      renderCalendar()
      renderEventCalendar()
    }

    document.getElementById('eventNextMonth').onclick = () => {
      currentMonth++
      if (currentMonth > 11) {
        currentMonth = 0
        currentYear++
      }
      renderCalendar()
      renderEventCalendar()
    }

    document.getElementById('saveBtn').onclick = saveEntry

    document.addEventListener('keydown', event => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 's') {
        event.preventDefault()
        if (appMode === 'diary' && !saveBtn.disabled) saveEntry()
      }
    })

    searchInput.addEventListener('input', () => {
      if (appMode === 'events') renderEventSidebarList()
      else renderEntriesList()
    })

    contentInput.addEventListener('input', updateWordCount)

    dateInput.addEventListener('change', () => {
      selectedDate = dateInput.value

      const date = new Date(selectedDate + 'T00:00:00')

      currentYear = date.getFullYear()
      currentMonth = date.getMonth()

      loadEntry(selectedDate)
      renderCalendar()
      renderEventViews()
    })

    // ===== 初始化 =====
    loadConfig()
    renderEventFields()
    const initialMode = location.hash === '#events' || localStorage.getItem('journal_view_mode') === 'events'
      ? 'events'
      : 'diary'

    dateInput.value = selectedDate
    timeInput.value = formatTime(today)
    renderInsights()

    ;(async () => {
      if (notionToken.value.trim() && notionDb.value.trim()) {
        try {
          await loadDiaryEntries()
          notionStatus.textContent = '✓ 已连接'
          notionStatus.className = 'config-status ok'
        } catch (e) {
          notionStatus.textContent = '未连接'
        }
      }
      loadEntry(selectedDate)
      setAppMode(initialMode)
    })()
  </script>
</body>
</html>
